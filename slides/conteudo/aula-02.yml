aula: 2
titulo: "Banco de dados e ActiveRecord"

# Slides marcados com "# CORTÁVEL" cobrem pré-requisitos (SQL).

slides:
  - tipo: capa
    titulo: "Banco de Dados,\nActiveRecord e o model User"
    corpo: |
      Capacitação Back-end
      Aula 2 de 4

      Fabrício Siqueira

  - tipo: objetivos
    titulo: "OBJETIVOS"
    bullets:
      - "Guardar dados de verdade, num Postgres."
      - "Entender migrations e ActiveRecord."
      - "Nunca mais guardar senha em texto."
      - "Criar o model User completo."

  - tipo: bullets
    titulo: "DE ONDE PARAMOS"
    bullets:
      - "Temos uma API que responde GET /api/v1/status."
      - "Ela não guarda nada. Reiniciou, esqueceu tudo."
      - "Hoje ela ganha memória."

  - tipo: secao
    titulo: "BANCO"

  - tipo: bullets
    titulo: "O MODELO RELACIONAL"  # CORTÁVEL
    bullets:
      - "Tabela é uma planilha: colunas fixas, linhas variáveis."
      - "Cada linha tem um id único — a chave primária."
      - "Uma tabela aponta para outra por chave estrangeira."
      - "Índice é o sumário do livro: acha sem ler tudo."
      - "SQL é a linguagem: SELECT, INSERT, UPDATE, DELETE."

  - tipo: bullets
    titulo: "POR QUE POSTGRES"
    bullets:
      - "SQLite é um arquivo. Ótimo para app de celular e script."
      - "No servidor ele trava: uma escrita por vez no banco inteiro."
      - "Postgres é servidor: aguenta concorrência de verdade."
      - "Tipos ricos (jsonb, arrays), índices parciais, transações."
      - "É o que o seem-backend usa em produção."
      - "Desenvolver no mesmo banco da produção evita bug que só aparece no deploy."

  - tipo: bullets
    titulo: "O BANCO VAI NUM CONTAINER"
    bullets:
      - "docker compose up -d e pronto."
      - "Todo mundo com a mesma versão, no mesmo comando."
      - "Desinstalar é docker compose down -v."
      - "Já tem Postgres na máquina ocupando a 5432?"
      - "- DB_PORT=5433 docker compose up -d"

  - tipo: secao
    titulo: "ACTIVERECORD"

  - tipo: bullets
    titulo: "O QUE É UM ORM"
    bullets:
      - "Object-Relational Mapping."
      - "Cada classe é uma tabela. Cada objeto é uma linha."
      - "Você escreve Ruby; ele escreve SQL."
      - "Não é para nunca mais ver SQL — é para não escrever o trivial."
      - "Quando a query fica esquisita, escreva SQL. É legítimo."

  - tipo: duas_colunas
    titulo: "DJANGO ORM  ×  ACTIVERECORD"
    esquerda_titulo: "DJANGO"
    esquerda:
      - "User.objects.filter(role='admin')"
      - "User.objects.get(id=1)"
      - "order_by('-created_at')"
      - "User.objects.count()"
      - "Campos declarados na classe"
    direita_titulo: "RAILS"
    direita:
      - "User.where(role: 'admin')"
      - "User.find(1)"
      - "order(created_at: :desc)"
      - "User.count"
      - "A classe não declara nada"
    notas: |
      A última linha é a diferença de filosofia. No Rails a fonte da verdade é
      a migration; a classe lê as colunas do banco em tempo de execução.

  - tipo: codigo
    titulo: "A CLASSE VAZIA JÁ SABE TUDO"
    codigo: |
      class User < ApplicationRecord
      end

      # Isso já tem name, email, id, created_at, updated_at —
      # tudo que existir na tabela users.
      #
      # A fonte da verdade é a migration, não a classe.

  - tipo: bullets
    titulo: "MIGRATIONS"
    bullets:
      - "Uma mudança no banco, versionada em código."
      - "Roda uma vez, em ordem, em todas as máquinas."
      - "Na sua, na do colega e no servidor."
      - "bin/rails generate migration CreateUsers"
      - "bin/rails db:migrate"
      - "O número no nome do arquivo é a data. É ele que define a ordem."

  - tipo: codigo
    titulo: "CRIANDO A TABELA USERS"
    codigo: |
      class CreateUsers < ActiveRecord::Migration[8.1]
        def change
          create_table :users do |t|
            t.string   :name, null: false
            t.string   :email, null: false
            t.string   :password_digest, null: false
            t.string   :course, null: false
            t.string   :matricula, null: false
            t.datetime :terms_accepted_at, null: false

            t.timestamps
          end

          add_index :users, :email, unique: true
          add_index :users, :matricula, unique: true
        end
      end

  - tipo: bullets
    titulo: "DOIS DETALHES DA MIGRATION"
    bullets:
      - "t.timestamps cria created_at e updated_at — o Rails mantém sozinho."
      - "add_index unique: true é restrição no BANCO, não no model."
      - "Por que importa:"
      - "- duas requisições simultâneas passam pela validação juntas"
      - "- as duas consultam, as duas não acham ninguém"
      - "- só uma vence o índice único"
      - "Validação é para mensagem bonita. Índice é para garantir."

  - tipo: bullets
    titulo: "SCHEMA.RB"
    bullets:
      - "Depois de migrar, o Rails reescreve db/schema.rb."
      - "É o retrato atual do banco."
      - "É ele que cria o banco de teste — por isso vai versionado."
      - "Você nunca edita esse arquivo à mão."
      - "Nunca edite migration que já rodou em produção. Crie outra."

  - tipo: secao
    titulo: "SENHA"

  - tipo: bullets
    titulo: "O QUE NUNCA FAZER"
    bullets:
      - "Nunca guarde senha em texto."
      - "Bancos vazam. É questão de quando."
      - "Vazou em texto, você entregou a senha de todo mundo."
      - "E como as pessoas repetem senha, entregou o e-mail e o banco delas junto."

  - tipo: bullets
    titulo: "HASH NÃO É CRIPTOGRAFIA"
    bullets:
      - "Criptografia tem volta, com a chave."
      - "Hash não tem volta. É caminho só de ida."
      - "Você não guarda a senha; guarda o resultado da função."
      - "No login, passa de novo e compara os resultados."

  - tipo: bullets
    titulo: "POR QUE BCRYPT E NÃO SHA-256"
    bullets:
      - "SHA-256 é rápido — e é esse o problema."
      - "Uma GPU testa bilhões por segundo."
      - "bcrypt é lento de propósito, com custo ajustável."
      - "Melhorou o hardware? Você aumenta o custo."
      - "E gera um salt aleatório por senha."
      - "Sem salt, mesma senha = mesmo hash, e uma tabela pronta quebra as duas."

  - tipo: codigo
    titulo: "ANATOMIA DE UM HASH BCRYPT"
    codigo: |
      $2a$12$R9h/cIPz0gi.URNNX3kh2OPST9/PgBkqquzi.Ss7KIUgO2t0jWMUW
       │   │  └─────────────── salt + hash
       │   └────────────────── fator de custo (12 = 2^12 iterações)
       └────────────────────── versão do algoritmo

  - tipo: codigo
    titulo: "HAS_SECURE_PASSWORD"
    codigo: |
      # Gemfile
      gem "bcrypt", "~> 3.1.7"

      # app/models/user.rb
      class User < ApplicationRecord
        has_secure_password validations: false
      end

      # Isso dá ao model:
      #   user.password = "..."         grava o digest
      #   user.authenticate("...")      confere
      #
      # A senha em texto NUNCA toca o banco.

  - tipo: secao
    titulo: "VALIDAÇÕES"

  - tipo: codigo
    titulo: "AS REGRAS DO USER"
    codigo: |
      validates :name, presence: true, length: { maximum: 120 }
      validates :email, presence: true,
                        uniqueness: { case_sensitive: false },
                        format: { with: URI::MailTo::EMAIL_REGEXP }
      validates :course, presence: true
      validates :matricula, presence: true, uniqueness: true,
                            format: { with: /\A\d{7}\z/ }
      validates :terms_accepted_at, presence: true, on: :create
      validate  :password_meets_policy, if: -> { password.present? }

  - tipo: bullets
    titulo: "LENDO AS VALIDAÇÕES"
    bullets:
      - "validates (plural) usa um validador pronto."
      - "validate (singular) chama um método seu."
      - "on: :create só valida na criação — termos se aceitam uma vez."
      - "if: recebe um lambda — na edição de perfil não há senha para validar."
      - "u.valid? e u.errors.full_messages no console."

  - tipo: bullets
    titulo: "NORMALIZE ANTES DE VALIDAR"
    bullets:
      - "Ana@UFOP.br e ana@ufop.br são o mesmo e-mail."
      - "20.112-34 e 2011234 são a mesma matrícula."
      - "normalize_email: strip + downcase"
      - "normalize_matricula: só os dígitos"
      - "Sem isso o índice único não serve para nada:"
      - "- o banco acha que são valores diferentes."

  - tipo: secao
    titulo: "CONCERNS"

  - tipo: bullets
    titulo: "O MIXIN DA AULA 1, NA PRÁTICA"
    bullets:
      - "O User vai ganhar confirmação de e-mail e recuperação de senha."
      - "Dois assuntos que não conversam entre si."
      - "Juntos no user.rb viram um arquivo de 800 linhas."
      - "Cada assunto vira um módulo em app/models/concerns/."
      - "No Rails isso tem nome: concern."

  - tipo: codigo
    titulo: "UM CONCERN"
    codigo: |
      module EmailVerifiable
        extend ActiveSupport::Concern

        CODE_TTL = 15.minutes

        included do
          scope :email_verified, -> { where.not(email_verified_at: nil) }
        end

        def email_verified?
          email_verified_at.present?
        end

        def issue_email_verification_code!
          code = format("%06d", SecureRandom.random_number(1_000_000))
          update!(
            email_verification_code_digest: BCrypt::Password.create(code),
            email_verification_expires_at: CODE_TTL.from_now
          )
          code
        end
      end

  - tipo: bullets
    titulo: "TRÊS DECISÕES DENTRO DO CONCERN"
    bullets:
      - "O código de 6 dígitos também vira digest bcrypt."
      - "- ele é uma senha temporária; quem lê o banco não pode usar."
      - "O código em texto só existe no retorno do método."
      - "- vai para o e-mail e some. Não fica em coluna nem em log."
      - "email_verified_at é data, não booleano."
      - "- booleano responde 'sim'; data responde 'sim, dia 12 às 14h'."

  - tipo: secao
    titulo: "CONSOLE"

  - tipo: codigo
    titulo: "BRINCANDO COM O MODEL"
    codigo: |
      bin/rails console

      u = User.new(name: "Ana Souza", email: "ana@aluno.ufop.edu.br",
                   password: "Automic@2026", course: "Automação",
                   matricula: "2011234", terms_accepted_at: Time.current)

      u.valid?
      u.save
      u.password_digest              # o hash, não a senha
      u.authenticate("Automic@2026") # devolve o user
      u.authenticate("errada")       # false

      codigo = u.issue_email_verification_code!
      u.verify_email_code!(codigo)
    notas: |
      Rode ao vivo. Mostrar o password_digest na tela é o momento em que a
      ficha cai sobre hashing.

  - tipo: bullets
    titulo: "SEEDS E FIXTURES"
    bullets:
      - "Seeds povoam o banco de desenvolvimento: bin/rails db:seed"
      - "Fixtures são os dados dos testes, em test/fixtures/users.yml."
      - "O Rails carrega antes de cada teste e limpa depois."
      - "Todo teste começa do mesmo estado."
      - "No teste, users(:ana) devolve o registro."

  - tipo: codigo
    titulo: "O TESTE QUE IMPORTA"
    codigo: |
      test "guarda o digest e nunca a senha em texto" do
        user = build_user
        user.save!

        assert_not_equal "Automic@2026", user.password_digest
        assert user.authenticate("Automic@2026")
        assert_not user.authenticate("outra-senha")
      end

  - tipo: bullets
    titulo: "UMA SUTILEZA DE SEGURANÇA"
    bullets:
      - "authenticate_by_email roda o bcrypt SEMPRE."
      - "Mesmo quando o e-mail não existe, com um digest descartável."
      - "Por quê? bcrypt é lento de propósito."
      - "- e-mail não existe → resposta em 1ms"
      - "- e-mail existe, senha errada → resposta em 100ms"
      - "Cronometrando, dá para descobrir quem tem conta. É ataque de temporização."
    notas: |
      Guardar esse método: ele é usado na Aula 3, no login.

  - tipo: pratica
    titulo: "PRÁTICA"
    bullets:
      - "Crie as três migrations e rode db:migrate."
      - "Abra db/schema.rb e confira as colunas."
      - "Escreva o User com has_secure_password e as validações."
      - "Crie os dois concerns e inclua no User."
      - "No console: crie usuário, veja o digest, teste authenticate."
      - "Emita um código, confirme, e tente confirmar de novo — tem que recusar."
      - "Escreva os testes e rode bin/rails test."

  - tipo: bullets
    titulo: "RECAPITULANDO"
    bullets:
      - "Migration é a fonte da verdade. O model não declara colunas."
      - "Índice único garante; validação dá mensagem bonita. Use os dois."
      - "Senha vira hash bcrypt, com salt, e não volta."
      - "Concern é o mixin do Rails: um assunto por arquivo."
      - "Normalize antes de validar."

  - tipo: fim
    titulo: "ATÉ A PRÓXIMA!"
    corpo: |
      NA PRÓXIMA: AUTENTICAÇÃO
