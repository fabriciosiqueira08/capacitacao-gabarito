  - tipo: pratica
    titulo: "PRÁTICA"
    bullets:
      - "Monte as cinco rotas."
      - "No Insomnia, uma requisição para cada uma."
      - "Percorra: cadastro → e-mail → confirmação → login → /me → logout → 401."
