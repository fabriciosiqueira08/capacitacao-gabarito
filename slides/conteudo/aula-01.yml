aula: 1
titulo: "Fundamentos de Back-end"

# Slides marcados com "# CORTÁVEL" cobrem pré-requisitos (terminal, Git).
# Se a turma já domina, apague o bloco inteiro e sobra tempo para a prática.

slides:
  - tipo: capa
    titulo: "Fundamentos de\nBack-end (Ruby on Rails)"
    corpo: |
      Fabrício Siqueira
      [idade]
      [cidade - UF]

      [curso]
      [período]
    notas: |
      Trocar os colchetes pelos seus dados. A foto do doador foi removida —
      adicione a sua no Canva, no espaço à esquerda.

  - tipo: objetivos
    titulo: "OBJETIVOS"
    bullets:
      - "Entender o que roda do outro lado da tela."
      - "Escrever Ruby partindo do que você já sabe de Python."
      - "Subir sua primeira API em Rails."
      - "Colocar ela no ar, numa máquina de verdade."
    notas: |
      Os quatro objetivos são as quatro aulas. Deixe claro que no fim do
      encontro 4 cada um vai ter uma URL https:// própria, funcionando.

  - tipo: secao
    titulo: "FERRAMENTAS"

  - tipo: titulo
    titulo: "VISUAL STUDIO CODE"
    notas: |
      Mesmo editor da capacitação de front. A diferença são as extensões.

  - tipo: bullets
    titulo: "EXTENSÕES ÚTEIS"
    bullets:
      - "Ruby LSP — autocomplete e erro em tempo real"
      - "Ruby Rails — pula entre model, controller e rota"
      - "Docker — ver e parar containers pela barra lateral"
      - "GitLens — quem escreveu esta linha, e quando"
      - "WSL — só Windows, abre o projeto do Ubuntu"
      - "vscode-icons"

  - tipo: bullets
    titulo: "O TERMINAL"  # CORTÁVEL
    bullets:
      - "No back-end você vive aqui. Não tem botão de play."
      - "- pwd — onde eu estou"
      - "- ls — o que tem aqui"
      - "- cd pasta — entrar"
      - "- cd .. — voltar"
      - "Ctrl+C mata o processo que está rodando."
      - "Seta pra cima repete o último comando."

  - tipo: bullets
    titulo: "INSOMNIA"
    bullets:
      - "Nossa API não tem tela. Ela responde JSON."
      - "O Insomnia é o navegador de quem faz back-end."
      - "Monta a requisição: método, URL, cabeçalhos, corpo."
      - "Mostra a resposta: status, cabeçalhos, corpo."
      - "Salva tudo numa coleção que dá para versionar."
    notas: |
      Se alguém já usa Postman, tanto faz. O que não pode é testar API
      digitando URL no navegador — o navegador só sabe fazer GET.

  - tipo: bullets
    titulo: "DOCKER"
    bullets:
      - "O banco de dados não vai ser instalado na sua máquina."
      - "Ele roda dentro de um container: um pacotinho isolado."
      - "Todo mundo com a mesma versão do Postgres, no mesmo comando."
      - "Desinstalar é apagar o container. Não sobra sujeira."
      - "Na Aula 4 é assim que a nossa API vai rodar no servidor."
    notas: |
      Não explicar Docker a fundo agora — isso é a Aula 4. Aqui é só
      "o banco roda num container e você não precisa saber mais que isso".

  - tipo: bullets
    titulo: "MISE"
    bullets:
      - "Instala a versão exata de Ruby que o projeto pede."
      - "Sem mexer no Ruby do sistema."
      - "Cada projeto pode usar uma versão diferente."
      - "É o pyenv do mundo Ruby. E o .ruby-version é o runtime.txt."
      - "Um arquivo .ruby-version na raiz e ele troca sozinho ao entrar na pasta."

  - tipo: codigo
    titulo: "SETUP EM QUATRO COMANDOS"
    codigo: |
      curl https://mise.run | sh
      mise use --global ruby@3.4.9
      gem install rails -v 8.1.3
      docker run --rm hello-world
    notas: |
      Se alguém ainda não fez, este é o momento. Todo mundo roda os quatro
      comandos e mostra a saída antes de seguir.

  - tipo: secao
    titulo: "BACK-END"

  - tipo: duas_colunas
    titulo: "OS DOIS LADOS"
    esquerda_titulo: "FRONT-END"
    esquerda:
      - "A parte visível, que o usuário toca."
      - "HTML, CSS, JavaScript."
      - "Roda no navegador ou no celular."
      - "Se cair, o usuário vê a tela quebrada."
    direita_titulo: "BACK-END"
    direita:
      - "A parte lógica, nos bastidores."
      - "Ruby, Python, Java, Go, Node."
      - "Roda num servidor, longe do usuário."
      - "Se cair, nada funciona."
    notas: |
      Retomar o slide 9 da capacitação do Fiuza — é literalmente a continuação
      dele. Front-end foi o "o que o usuário vê"; agora é o outro lado.

  - tipo: bullets
    titulo: "O QUE O BACK-END FAZ"
    bullets:
      - "Guarda os dados e decide quem pode ver o quê."
      - "Aplica as regras de negócio."
      - "Autentica usuários."
      - "Fala com outros sistemas: e-mail, pagamento, mapas."
      - "Processa o que é pesado demais para o celular."
      - "Nada disso pode viver no front — o usuário mexeria."
    notas: |
      Este último ponto é o mais importante. Qualquer coisa que roda no
      navegador o usuário consegue ler e alterar. Por isso a validação de
      senha do front é conveniência; a que vale é a do back.

  - tipo: bullets
    titulo: "A ANALOGIA DO RESTAURANTE"
    bullets:
      - "O salão é o front-end: mesa, cardápio, garçom."
      - "A cozinha é o back-end: ninguém entra, mas é lá que a comida sai."
      - "O pedido é a requisição."
      - "O prato é a resposta."
      - "Você não pede pra ver a receita. Você pede o prato."
    notas: |
      Analogia física, no estilo dos slides do Fiuza ("HTML são os tijolos").
      Vale voltar nela quando falar de API.

  - tipo: bullets
    titulo: "CLIENTE E SERVIDOR"
    bullets:
      - "Cliente: quem pede. Navegador, app, outro servidor."
      - "Servidor: quem responde. Um computador ligado o tempo todo."
      - "O cliente sempre começa a conversa. O servidor nunca liga primeiro."
      - "Entre os dois: a internet, e o protocolo HTTP."

  - tipo: bullets  # EXTRA
    titulo: "O QUE É UM SERVIDOR, AFINAL"
    bullets:
      - "Não é uma máquina especial. É um programa esperando."
      - "Ele fica ligado, escutando numa PORTA."
      - "Chegou requisição naquela porta, ele responde."
      - "bin/rails server sobe esse programa na porta 3000."
      - "Na sua máquina ou numa VM na nuvem — é o mesmo programa."

  - tipo: bullets  # EXTRA
    titulo: "IP E PORTA"
    bullets:
      - "IP é o endereço da máquina. Ex.: 57.156.65.151"
      - "Porta é a sala dentro dela. Um número de 1 a 65535."
      - "Uma máquina, milhares de portas, um programa em cada."
      - "- 22 SSH · 80 HTTP · 443 HTTPS · 5432 Postgres · 3000 Rails em dev"
      - "127.0.0.1 (localhost) é sempre 'esta máquina aqui'."
      - "Na Aula 4 vamos abrir e fechar portas na mão. Guarde isso."

  - tipo: bullets  # EXTRA
    titulo: "DNS: DE NOME PARA NÚMERO"
    bullets:
      - "Ninguém decora 57.156.65.151."
      - "O DNS é a agenda telefônica da internet."
      - "Você digita api.seemxxiii.tech; alguém pergunta ao DNS o IP."
      - "A resposta fica em cache por um tempo — o TTL."
      - "É por isso que trocar um domínio de servidor não vale na hora."
      - "Na Aula 4 você vai criar um desses registros."

  - tipo: codigo  # EXTRA
    titulo: "ANATOMIA DE UMA URL"
    codigo: |
      https :// api.seemxxiii.tech : 443 /api/v1/lectures ?page=2 #topo
        │             │              │          │           │      │
      esquema        host          porta     caminho      query  fragmento

      # O esquema diz o protocolo (http, https, ssh, postgres...).
      # A porta é opcional: http assume 80, https assume 443.
      #
      # É por isso que localhost:3000 tem os dois pontos:
      # a porta não é a padrão.

  - tipo: bullets
    titulo: "HTTP"
    bullets:
      - "É o idioma que os dois falam."
      - "Toda conversa tem duas partes: requisição e resposta."
      - "A requisição tem: método, caminho, cabeçalhos e corpo."
      - "A resposta tem: status, cabeçalhos e corpo."
      - "É sem memória: cada requisição começa do zero."

  - tipo: codigo  # EXTRA
    titulo: "UMA REQUISIÇÃO CRUA"
    codigo: |
      POST /api/v1/sessions HTTP/1.1        ← método, caminho, versão
      Host: api.seemxxiii.tech              ┐
      Content-Type: application/json        │ cabeçalhos
      Accept: application/json              ┘
                                            ← linha em branco separa
      {"email":"ana@ufop.br","password":"..."}   ← corpo

      # É texto puro. HTTP é literalmente isso trafegando num cano.

  - tipo: bullets  # EXTRA
    titulo: "OS CABEÇALHOS"
    bullets:
      - "São metadados: informação SOBRE a mensagem, não a mensagem."
      - "Chave: valor, uma por linha."
      - "Content-Type — em que formato vai o corpo"
      - "Accept — em que formato eu quero a resposta"
      - "Authorization — quem sou eu (vai ser o nosso token, na Aula 3)"
      - "Set-Cookie / Cookie — como o navegador guarda estado"
      - "User-Agent — que programa está chamando"

  - tipo: bullets  # EXTRA
    titulo: "CONTENT-TYPE IMPORTA"
    bullets:
      - "O mesmo corpo, dois formatos possíveis:"
      - "- application/json → {\"email\":\"ana@ufop.br\"}"
      - "- application/x-www-form-urlencoded → email=ana%40ufop.br"
      - "Sem o cabeçalho, o servidor não sabe como ler o corpo."
      - "Esquecer isso no curl é o erro nº 1 de quem começa:"
      - "- vem 400 e a mensagem não ajuda em nada."
    notas: |
      "Sem memória" (stateless) é a semente do problema de autenticação da
      Aula 3: se o servidor esquece tudo entre uma requisição e outra, como
      ele sabe que você já fez login? Guarde essa pergunta.

  - tipo: bullets
    titulo: "OS VERBOS"
    bullets:
      - "GET — me dá isso (não muda nada)"
      - "POST — cria isso"
      - "PUT / PATCH — altera isso"
      - "DELETE — apaga isso"
      - "O verbo é uma promessa. GET que apaga coisa é bug, não criatividade."

  - tipo: bullets
    titulo: "OS STATUS CODES"
    bullets:
      - "2xx — deu certo. 200 ok, 201 criado."
      - "3xx — foi pra outro lugar."
      - "4xx — você errou. 400 pedido mal feito, 401 não autenticado,"
      - "- 403 autenticado mas sem permissão, 404 não existe, 422 dado inválido."
      - "5xx — nós erramos. 500 é bug nosso."
      - "A diferença entre 401 e 403 cai em toda entrevista."
    notas: |
      401 = "quem é você?". 403 = "sei quem você é, e você não pode".
      Vamos usar os dois na Aula 3.

  - tipo: codigo
    titulo: "UMA REQUISIÇÃO DE VERDADE"
    codigo: |
      $ curl -i https://api.seemxxiii.tech/api/v1/status

      HTTP/2 200
      content-type: application/json; charset=utf-8

      {"status":"ok","service":"seem-backend"}
    notas: |
      Rodar ao vivo. É a API do SEEM, está no ar. Mostra que "back-end" não é
      abstração: é um endereço que responde.

  - tipo: bullets
    titulo: "JSON"
    bullets:
      - "É o formato em que cliente e servidor trocam dados."
      - "Chave e valor, como o dict do Python."
      - "Só tem texto, número, booleano, nulo, lista e objeto."
      - "Não tem data, não tem classe, não tem comentário."
      - "É texto puro. Qualquer linguagem lê."

  - tipo: bullets
    titulo: "O QUE É UMA API REST"
    bullets:
      - "API: a porta de entrada do sistema para outros programas."
      - "REST: um estilo de organizar essa porta."
      - "Cada coisa do sistema é um recurso, com um endereço."
      - "/api/v1/lectures são as palestras. /api/v1/lectures/7 é a palestra 7."
      - "O que você faz com ela é o verbo, não o endereço."
      - "Errado: /criarPalestra. Certo: POST /lectures."

  - tipo: duas_colunas
    titulo: "DOIS JEITOS DE FAZER"
    esquerda_titulo: "SITE COM TELAS"
    esquerda:
      - "O servidor devolve HTML pronto."
      - "Uma linguagem, um projeto."
      - "Site institucional, blog, painel interno."
    direita_titulo: "API + CLIENTES"
    direita:
      - "O servidor devolve só dados."
      - "App, painel web e site consomem a mesma API."
      - "É o SEEM: um back-end, um app e um painel."
    notas: |
      O seem-backend é --api: não tem view nenhuma. Quem desenha tela é o
      app React Native e o painel admin. É o que vamos construir aqui.

  - tipo: secao
    titulo: "RUBY"

  - tipo: bullets
    titulo: "DE ONDE VEIO"
    bullets:
      - "Criado por Yukihiro Matsumoto, o Matz, em 1995, no Japão."
      - "O objetivo declarado: fazer o programador feliz."
      - "Interpretada, dinâmica, orientada a objetos — como Python."
      - "Estourou em 2005, com o Rails."
      - "Hoje: GitHub, Shopify, Airbnb, Basecamp e o seem-backend."

  - tipo: duas_colunas
    titulo: "PYTHON  ×  RUBY"
    esquerda_titulo: "PYTHON"
    esquerda:
      - "Indentação delimita bloco"
      - "None / True / False"
      - "dict, list, tuple"
      - "return explícito"
      - "f\"Olá {nome}\""
      - "self"
      - "pip + venv"
    direita_titulo: "RUBY"
    direita:
      - "def ... end"
      - "nil / true / false"
      - "Hash, Array, símbolos"
      - "última linha é o retorno"
      - "\"Olá #{nome}\""
      - "self (igual)"
      - "gem + bundler"
    notas: |
      Insistir: quem sabe Python já sabe 80% de Ruby. A curva é de sintaxe e
      de convenção, não de conceito.

  - tipo: codigo
    titulo: "A MESMA FUNÇÃO"
    codigo: |
      # Python
      def saudacao(nome, formal=False):
          if formal:
              return f"Prezado {nome}"
          return f"Oi, {nome}"

      # Ruby
      def saudacao(nome, formal: false)
        return "Prezado #{nome}" if formal
        "Oi, #{nome}"
      end
    notas: |
      Três diferenças para apontar: o `end`, o `if` no final da linha
      (modificador), e a última linha ser o retorno sem escrever `return`.

  - tipo: bullets
    titulo: "TUDO É OBJETO"
    bullets:
      - "Em Python, len(x). Em Ruby, x.length."
      - "Número é objeto: 3.times { puts \"oi\" }"
      - "nil é objeto: nil.to_s devolve \"\"."
      - "Até a classe é objeto."
      - "Não existe função solta: é sempre método de alguém."

  - tipo: bullets
    titulo: "SÍMBOLOS"
    bullets:
      - "Escrito com dois-pontos: :aluno, :email, :admin"
      - "É um texto que serve de etiqueta, não de conteúdo."
      - "O mesmo símbolo é sempre o mesmo objeto na memória."
      - "Não existe em Python — lá você usaria uma string."
      - "Rails usa símbolo em tudo: chave de hash, nome de campo, estado."
    notas: |
      Regra prática: se é conteúdo que o usuário lê, string. Se é nome de
      alguma coisa no código, símbolo.

  - tipo: codigo
    titulo: "HASH  ×  DICT"
    codigo: |
      # Python
      usuario = {"nome": "Ana", "role": "admin"}
      usuario["nome"]

      # Ruby
      usuario = { nome: "Ana", role: :admin }
      usuario[:nome]

      # a chave é um símbolo — { nome: } é açúcar para { :nome => }

  - tipo: bullets
    titulo: "BLOCOS"
    bullets:
      - "Um pedaço de código que você entrega para um método executar."
      - "Entre chaves quando cabe numa linha."
      - "Entre do e end quando não cabe."
      - "É o lambda do Python, mas usado o tempo todo, não de vez em quando."
      - "Quase todo laço em Ruby é um bloco."

  - tipo: codigo
    titulo: "BLOCOS NA PRÁTICA"
    codigo: |
      # Python                          # Ruby
      for u in usuarios:                usuarios.each do |u|
          print(u.nome)                   puts u.nome
                                        end

      [u.nome for u in usuarios]        usuarios.map { |u| u.nome }

      [u for u in usuarios if u.ativo]  usuarios.select { |u| u.ativo? }
    notas: |
      map/select/reject/reduce existem nos dois. A diferença é que em Ruby
      isso é o caminho normal, não uma alternativa "elegante".

  - tipo: bullets
    titulo: "O ?  E  O  !"
    bullets:
      - "Método terminado em ? devolve verdadeiro ou falso."
      - "- user.admin?  ·  user.email_verified?"
      - "Método terminado em ! é a versão perigosa."
      - "- save salva e devolve false se falhar"
      - "- save! salva e estoura erro se falhar"
      - "É convenção, não regra da linguagem. Mas todo mundo segue."

  - tipo: codigo  # EXTRA
    titulo: "ARGUMENTOS NOMEADOS"
    codigo: |
      # Python
      def login(email, password, client="mobile"): ...
      login(email="a@b.c", password="x")

      # Ruby — os dois-pontos DEPOIS do nome tornam obrigatório nomear
      def login(email:, password:, client: "mobile")
      end
      login(email: "a@b.c", password: "x")

      # E desde o Ruby 3.1, se a variável tem o mesmo nome da chave:
      email = "a@b.c"
      login(email:, password:)     # em vez de login(email: email, ...)
    notas: |
      Esse atalho aparece em TODO service do projeto — `Result.new(success?: true, user:)`.
      Sem explicar, eles leem como erro de digitação.

  - tipo: codigo  # EXTRA
    titulo: "STRUCT: UMA CLASSE DE UMA LINHA"
    codigo: |
      # Quando você só quer agrupar valores, sem comportamento:
      Result = Struct.new(:success?, :user, :errors, keyword_init: true)

      r = Result.new(success?: true, user: ana)
      r.success?   # true
      r.user       # ana

      # keyword_init: true obriga a nomear na criação.
      #
      # É o namedtuple / dataclass do Python.
      # Todo service do projeto devolve um Struct desses.

  - tipo: bullets  # EXTRA
    titulo: "EXCEÇÕES"
    bullets:
      - "Mesma ideia do Python, outra palavra."
      - "- try  → begin"
      - "- except → rescue"
      - "- finally → ensure"
      - "- raise → raise (igual)"
      - "Em método, o begin é implícito: dá para escrever só rescue no fim."
      - "raise sem argumento re-lança a exceção atual."

  - tipo: codigo  # EXTRA
    titulo: "EXCEÇÕES NA PRÁTICA"
    codigo: |
      # Python                        # Ruby
      try:                            begin
          arriscado()                   arriscado
      except ValueError as e:         rescue ArgumentError => e
          print(e)                      puts e.message
      finally:                        ensure
          limpar()                      limpar
                                      end

      # Criando o seu próprio tipo de erro:
      class InvalidToken < StandardError; end

      raise InvalidToken if token_ruim?
    notas: |
      `class InvalidToken < StandardError; end` aparece em Auth::DecodeToken na
      Aula 3. Sempre herde de StandardError, nunca de Exception.

  - tipo: codigo  # EXTRA
    titulo: "CASE, E A SETA"
    codigo: |
      # case: o if/elif encadeado. Não precisa de break.
      case client
      when "mobile" then header["Authorization"] = "Bearer #{token}"
      when "web"    then set_auth_cookie(token)
      end

      # -> é um lambda: código guardado para rodar DEPOIS
      dobro = ->(x) { x * 2 }
      dobro.call(3)

      # É o que vocês vão ver no model, na Aula 2:
      scope :recentes, -> { order(occurred_at: :desc) }
      validate :password_meets_policy, if: -> { password.present? }
    notas: |
      A seta aparece pela primeira vez na Aula 2 (scope e validate condicional).
      Sem este slide, ela lê como símbolo mágico. A ideia: o Rails guarda aquele
      pedaço de código para executar na hora da consulta ou da validação.

  - tipo: bullets  # EXTRA
    titulo: "TRÊS PEGADINHAS DE QUEM VEM DO PYTHON"
    bullets:
      - "7 / 2 dá 3, e não 3.5."
      - "- inteiro com inteiro dá inteiro. Use 7.0 / 2 ou 7.fdiv(2)."
      - "Aspas simples NÃO interpolam."
      - "- \"Olá #{nome}\" funciona; 'Olá #{nome}' imprime o #{nome} cru."
      - "0 e \"\" são VERDADEIROS."
      - "- só nil e false são falsos. if 0 executa."

  - tipo: bullets
    titulo: "MÓDULOS E MIXINS"
    bullets:
      - "Ruby não tem herança múltipla."
      - "Tem módulo: um saco de métodos que você inclui numa classe."
      - "include EmailVerifiable e a classe ganha aqueles métodos."
      - "É como os Mixins do Django, mas nativo e usado o tempo todo."
      - "No seem-backend é assim que o User ganha verificação de e-mail"
      - "- e recuperação de senha, sem virar um arquivo de 800 linhas."
    notas: |
      Vamos escrever dois módulos desses na Aula 2. Guarde o nome: concern.

  - tipo: duas_colunas
    titulo: "DEPENDÊNCIAS"
    esquerda_titulo: "PYTHON"
    esquerda:
      - "pip install"
      - "requirements.txt"
      - "venv, por projeto"
      - "pip freeze para travar versão"
    direita_titulo: "RUBY"
    direita:
      - "gem install"
      - "Gemfile"
      - "bundler resolve tudo"
      - "Gemfile.lock, gerado sozinho"
    notas: |
      O Gemfile.lock é o requirements.txt travado, só que automático e
      obrigatoriamente versionado. Ele é a garantia de que a sua máquina e o
      servidor rodam exatamente as mesmas versões.

  - tipo: pratica
    titulo: "PRÁTICA"
    bullets:
      - "Abra o console do Ruby: irb"
      - "Descubra o tipo de tudo com .class"
      - "- 3.class  ·  \"oi\".class  ·  :oi.class  ·  nil.class"
      - "Rode 5.times { |i| puts i }"
      - "Crie um hash e leia uma chave por símbolo."
      - "Transforme [1,2,3] em [1,4,9] usando map."

  - tipo: secao
    titulo: "RAILS"

  - tipo: bullets
    titulo: "O QUE É RAILS"
    bullets:
      - "Framework web em Ruby, criado por David Heinemeier Hansson em 2004."
      - "Nasceu extraído do Basecamp — um produto real, não um exercício."
      - "Traz tudo junto: rotas, banco, e-mail, filas, testes, deploy."
      - "Está na versão 8. É a versão que o seem-backend usa."
      - "A promessa: uma pessoa sozinha consegue construir um sistema inteiro."

  - tipo: bullets
    titulo: "CONVENÇÃO SOBRE CONFIGURAÇÃO"
    bullets:
      - "Você não configura o óbvio. Você segue o combinado."
      - "Classe User? Então a tabela é users. Ninguém precisa dizer."
      - "Arquivo user.rb, classe User, tabela users, id chamado id."
      - "Seguindo a convenção, você escreve quase nada."
      - "Brigando com ela, você escreve o dobro."
    notas: |
      É a maior diferença cultural em relação a Flask/FastAPI, onde você
      monta cada peça. Aqui o framework já decidiu — e decidiu bem.

  - tipo: bullets
    titulo: "DRY  E  OMAKASE"
    bullets:
      - "DRY: Don't Repeat Yourself. Cada regra existe num lugar só."
      - "Omakase: \"deixa comigo, chef\", em japonês."
      - "O Rails já escolheu as ferramentas por você."
      - "Você pode trocar. Mas só troque quando tiver um motivo real."
      - "Isso é liberdade, não prisão: sobra tempo pro problema de verdade."

  - tipo: duas_colunas
    titulo: "DJANGO  ×  RAILS"
    esquerda_titulo: "DJANGO"
    esquerda:
      - "models.py, com classes Model"
      - "makemigrations / migrate"
      - "urls.py, escrito à mão"
      - "views.py"
      - "Django ORM"
      - "manage.py"
    direita_titulo: "RAILS"
    direita:
      - "app/models/, um arquivo por classe"
      - "rails g migration / db:migrate"
      - "config/routes.rb"
      - "app/controllers/"
      - "ActiveRecord"
      - "bin/rails"
    notas: |
      Quem vem de Flask ou FastAPI vai sentir mais diferença: lá você monta
      cada peça, aqui elas já vêm encaixadas.

  - tipo: bullets
    titulo: "MVC"
    bullets:
      - "Model — os dados e as regras. Conversa com o banco."
      - "View — a tela. Na nossa API, é o JSON."
      - "Controller — recebe a requisição e decide o que fazer."
      - "Rota — o mapa: este endereço vai para aquele controller."
      - "O caminho é sempre: rota → controller → model → resposta."

  - tipo: codigo
    titulo: "CRIANDO O PROJETO"
    codigo: |
      rails new automic_auth_api --api -d postgresql
      cd automic_auth_api

      # --api    → sem HTML, sem CSS, sem sessão. Só JSON.
      # -d postgresql → o banco que usamos em produção
    notas: |
      Sem o --api o Rails traz o pacote completo de site com telas. Não
      precisamos de nada disso, e cada peça a menos é uma peça a menos para
      dar problema.

  - tipo: bullets  # EXTRA
    titulo: "ZEITWERK: O NOME DIZ O CAMINHO"
    bullets:
      - "Você nunca escreve require no Rails. Por quê?"
      - "O Zeitwerk carrega a classe na hora em que você a menciona."
      - "E ele descobre o arquivo pelo NOME da classe:"
      - "- Api::V1::StatusController → app/controllers/api/v1/status_controller.rb"
      - "Errou o caminho, a classe não existe. Não é estilo — é mecanismo."
      - "É o que faz 'convenção sobre configuração' funcionar de verdade."

  - tipo: bullets  # EXTRA
    titulo: "OS TRÊS AMBIENTES"
    bullets:
      - "development — sua máquina. Recarrega código, log verboso, erro na tela."
      - "test — os testes. Banco separado, que é limpo a cada teste."
      - "production — o servidor. Código congelado, log enxuto, erro genérico."
      - "config/environments/ tem um arquivo para cada."
      - "Rails.env diz onde você está."
      - "É assim que o e-mail abre no navegador em dev e vai por SMTP em produção."

  - tipo: bullets
    titulo: "TOUR DAS PASTAS"
    bullets:
      - "app/ — o seu código. É onde você passa 90% do tempo."
      - "- models, controllers, mailers, serializers, services"
      - "config/ — rotas, banco, ambientes, credenciais"
      - "db/ — migrations e o retrato atual do banco (schema.rb)"
      - "test/ — os testes"
      - "Gemfile — as dependências"
      - "bin/ — os comandos: rails, setup, dev"

  - tipo: bullets
    titulo: "OS COMANDOS DO DIA A DIA"
    bullets:
      - "bin/rails server — sobe a aplicação"
      - "bin/rails console — um irb com o seu projeto carregado dentro"
      - "bin/rails routes — todas as rotas que existem"
      - "bin/rails generate — cria arquivos seguindo a convenção"
      - "bin/rails db:migrate — aplica as mudanças de banco"
      - "bin/rails test — roda os testes"
    notas: |
      O console é a ferramenta mais subestimada do Rails. Dá para criar
      usuário, rodar query e testar método sem escrever um arquivo.

  - tipo: codigo
    titulo: "A PRIMEIRA ROTA"
    codigo: |
      # config/routes.rb
      namespace :api do
        namespace :v1 do
          get "status", to: "status#show"
        end
      end

      # app/controllers/api/v1/status_controller.rb
      class Api::V1::StatusController < ApplicationController
        def show
          render json: { status: "ok", service: "automic-auth-api" }
        end
      end

  - tipo: pratica
    titulo: "PRÁTICA"
    bullets:
      - "Crie o projeto com rails new."
      - "Suba o Postgres com docker compose up -d."
      - "Rode bin/rails server e abra http://localhost:3000/up."
      - "Crie a rota GET /api/v1/status."
      - "Chame ela no Insomnia e confira o status 200."
      - "Rode bin/rails routes e ache a sua rota na lista."
    notas: |
      Esta é a entrega da aula. Ninguém sai daqui sem os 200 na tela.
      Quem travar: git checkout aula-01.

  - tipo: bullets
    titulo: "GIT"  # CORTÁVEL
    bullets:
      - "git init — começa a versionar"
      - "git add . — separa o que vai no próximo commit"
      - "git commit -m \"mensagem\" — grava o ponto"
      - "git push — manda para o GitHub"
      - "Na Aula 4, é o push que dispara o deploy. Literalmente."

  - tipo: bullets
    titulo: "RECAPITULANDO"
    bullets:
      - "Back-end é a cozinha: regra, dado e permissão."
      - "HTTP é o idioma; verbo, status e JSON são o vocabulário."
      - "Ruby é Python com outra sintaxe e mais açúcar."
      - "Rails decide o óbvio por você — siga a convenção."
      - "Você já tem uma API respondendo. Na próxima ela ganha banco."

  - tipo: fim
    titulo: "ATÉ A PRÓXIMA!"
    corpo: |
      BONS ESTUDOS
