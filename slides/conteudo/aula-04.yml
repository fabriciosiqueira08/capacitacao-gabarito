aula: 4
titulo: "Servidor, Docker, Kamal e deploy"

# Slides marcados com "# CORTÁVEL" cobrem pré-requisitos (Linux).

slides:
  - tipo: capa
    titulo: "Servidor, Docker,\nKamal e Deploy"
    corpo: |
      Capacitação Back-end
      Aula 4 de 4

      Fabrício Siqueira

  - tipo: objetivos
    titulo: "OBJETIVOS"
    bullets:
      - "Subir o seu próprio servidor Linux, do zero."
      - "Entrar nele por SSH, com chave. E fechá-lo."
      - "Entender Docker e Kamal de verdade."
      - "Colocar a sua API no ar, com HTTPS."

  - tipo: bullets
    titulo: "DE ONDE PARAMOS, E O ÚLTIMO DIA"
    bullets:
      - "Vocês têm uma API com cinco fluxos de autenticação, testada."
      - "Ela roda na máquina de vocês. Hoje ela SAI de lá."
      - "Hoje é a aula mais diferente das quatro: vocês não escrevem Ruby."
      - "Vocês operam uma máquina: firewall, Docker, chave SSH, HTTPS."
      - "É vocabulário novo em três horas. É normal se sentir mais perdido hoje."
      - "E uma dica que resolve metade da confusão: OLHE EM QUAL MÁQUINA VOCÊ ESTÁ."
      - "- o prompt diz: voce@notebook ou ubuntu@servidor"
    notas: |
      A frase sobre se sentir mais perdido é importante e é verdade. Diga
      com naturalidade — ela impede que alguém conclua sozinho que "não leva
      jeito para back-end" quando na verdade é assunto novo mesmo.
      A dica do prompt você vai repetir umas cinco vezes hoje. Comece agora.

  - tipo: secao
    titulo: "O SERVIDOR"

  - tipo: bullets
    titulo: "ONDE O SEU CÓDIGO VAI RODAR"
    bullets:
      - "Hoje: uma máquina virtual dentro do seu notebook."
      - "Kernel, disco, rede, usuários. Um computador inteiro, em software."
      - "Roda Ubuntu Server, tem IP próprio, e você entra nela por SSH."
      - "Exatamente como entraria numa máquina alugada do outro lado do mundo."
    notas: |
      O ponto da aula toda: o trabalho é o mesmo. Muda o IP e a conta no
      fim do mês, não o que você faz.

  - tipo: bullets
    titulo: "POR QUE UMA VM"
    bullets:
      - "Um servidor tem que ser descartável."
      - "Você vai errar config de SSH, encher disco, instalar coisa demais."
      - "Numa VM o conserto é multipass delete && multipass launch."
      - "No seu notebook, o conserto é o seu sábado."
      - "E por que não só Docker? Container compartilha o kernel do host."
      - "- sem usuário, sem firewall, sem systemd, sem sshd"

  - tipo: bullets
    titulo: "O QUE MUDA NUMA VPS ALUGADA"
    bullets:
      - "IP: privado aqui, público lá. O mundo inteiro alcança."
      - "Firewall: ufw aqui; ufw MAIS o do provedor lá."
      - "Certificado: autoassinado aqui; de uma CA pública lá."
      - "Quem invade: ninguém aqui; bots, o dia todo, desde o primeiro minuto."
      - "Todo o resto é idêntico. Literalmente o mesmo deploy.yml."

  - tipo: bullets
    titulo: "AS QUATRO OPÇÕES"
    bullets:
      - "Hospedagem compartilhada: você não controla nada."
      - "PaaS (Heroku, Render, Fly): controla o app, opera nada."
      - "- paga mais e obedece as regras deles"
      - "VPS: controla tudo, e opera tudo."
      - "Kubernetes: controla tudo, em escala, e opera muito mais."

  - tipo: bullets
    titulo: "POR QUE VM, E NÃO KUBERNETES"
    bullets:
      - "O seem-backend atende ~500 usuários num evento de uma semana."
      - "Kubernetes adicionaria custo e operação sem resolver problema nenhum."
      - "Menos peças para monitorar."
      - "Deploy reproduzível com Docker e Kamal."
      - "Evoluir só quando uma métrica real pedir."
    notas: |
      Escolher a ferramenta grande antes do problema grande é a forma mais
      cara de errar. Vale insistir nisso.

  - tipo: bullets
    titulo: "E O QUE ISSO CUSTA"
    bullets:
      - "Uma VM é ponto único de falha."
      - "Volume Docker não é backup."
      - "O Postgres não é gerenciado: quem cuida é você."
      - "Admitir o custo faz parte da decisão."

  - tipo: secao
    titulo: "A MÁQUINA"

  - tipo: codigo
    titulo: "MULTIPASS"
    codigo: |
      # Linux
      sudo snap install multipass

      # macOS
      brew install --cask multipass

      # Windows (PowerShell como administrador)
      winget install Canonical.Multipass

      multipass version
    notas: |
      Windows + WSL2: são duas VMs diferentes e por padrão uma não enxerga a
      outra. Duas correções, e isto tinha que estar resolvido antes da aula:
      networkingMode=mirrored no .wslconfig (Win11 22H2+), ou netsh portproxy
      para 2222/443/80 (qualquer Windows). No segundo caso o SERVER_IP deles é
      o do Windows e o .env leva SSH_PORT=2222 — o deploy.yml já lê isso.
      Se alguém travar aqui: ./scripts/checar-servidor.sh <IP> diz o caso.

  - tipo: bullets  # EXTRA
    titulo: "DUAS CHAVES, UM PAR"
    bullets:
      - "Criptografia assimétrica: duas chaves que se completam."
      - "A PÚBLICA você espalha. A PRIVADA nunca sai da sua máquina."
      - "O que uma fecha, só a outra abre."
      - "Duas coisas saem daí:"
      - "- sigilo: fecho com a sua pública, só você abre"
      - "- assinatura: fecho com a minha privada, todos conferem que fui eu"

  - tipo: bullets  # EXTRA
    titulo: "É COMO O SSH FUNCIONA"
    bullets:
      - "Você põe a sua chave PÚBLICA no servidor (authorized_keys)."
      - "Ao conectar, o servidor manda um desafio."
      - "Você responde assinando com a PRIVADA."
      - "O servidor confere com a pública que já tinha. Entrou."
      - "A senha nunca trafega. Nem existe."
      - "É por isso que perder a chave privada é perder o acesso."
    notas: |
      Mesma matemática da assinatura do JWT da Aula 3 — lá é chave simétrica
      (HS256), aqui é par de chaves. Vale fazer a ponte.

  - tipo: codigo
    titulo: "O PAR DE CHAVES"
    codigo: |
      ssh-keygen -t ed25519 -f ~/.ssh/capacita \
        -C "capacita-servidor" -N ""

      chmod 600 ~/.ssh/capacita

      # chmod 600 = só você lê.
      # O SSH RECUSA usar chave com permissão frouxa.
      #
      # Uma chave por finalidade: não reaproveite a do GitHub.
    notas: |
      Chave privada não vai por e-mail, não vai por WhatsApp, não vai para o
      Git. Nunca.

  - tipo: codigo
    titulo: "CLOUD-INIT: A MÁQUINA JÁ NASCE PRONTA"
    codigo: |
      cat > cloud-init.yaml <<EOF
      #cloud-config
      ssh_authorized_keys:
        - $(cat ~/.ssh/capacita.pub)
      EOF

      # cloud-init é o padrão que TODO provedor de nuvem usa
      # para configurar uma VM no primeiro boot.
      #
      # Repare: quem entra no arquivo é a chave PÚBLICA.

  - tipo: codigo
    titulo: "SUBIR A VM"
    codigo: |
      multipass launch 24.04 --name servidor \
        --cpus 2 --memory 2G --disk 10G \
        --cloud-init cloud-init.yaml

      multipass info servidor
      # IPv4:  10.161.42.87    <- o seu SERVER_IP

      ssh -i ~/.ssh/capacita ubuntu@SEU_IP
      # o prompt vira ubuntu@servidor.
      # você está dentro de outro computador.

      # não conectou?
      ./scripts/checar-servidor.sh SEU_IP

  - tipo: pratica
    titulo: "PRÁTICA 1 — SUBIR A VM E ENTRAR NELA"
    bullets:
      - "ssh-keygen -t ed25519 -f ~/.ssh/capacita  ·  chmod 600"
      - "Escreva o cloud-init.yaml com a sua chave PÚBLICA."
      - "multipass launch 24.04 --name servidor ...  e  multipass info"
      - "ssh -i ~/.ssh/capacita ubuntu@SEU_IP"
      - "Confere: o prompt virou ubuntu@servidor."
      - "Não conectou? ./scripts/checar-servidor.sh SEU_IP diz o porquê."
      - "Apostila: Prática 1."
    notas: |
      ~20 minutos, e boa parte é download. Mande rodar o launch AGORA e
      deixe baixando enquanto você dá a teoria de chaves.
      Se alguém do Windows der timeout, rode o script nele e aplique a
      correção que ele imprimir. Se não sair em 5 min, dupla e siga.

  - tipo: secao
    titulo: "UBUNTU"

  - tipo: bullets
    titulo: "LINUX BÁSICO"  # CORTÁVEL
    bullets:
      - "apt update / apt install: o gerenciador de pacotes"
      - "sudo: executar como root, uma vez"
      - "systemctl status / restart: serviços"
      - "journalctl -u ssh: logs de um serviço"
      - "free -h e df -h: memória e disco"
      - "chmod 600 arquivo: só o dono lê e escreve"

  - tipo: bullets  # EXTRA
    titulo: "ROOT E PERMISSÕES"
    bullets:
      - "root é o usuário que pode tudo. Não tem 'tem certeza?'."
      - "Você trabalha como ubuntu e chama sudo quando precisa."
      - "Todo arquivo tem dono, grupo e três permissões: ler, escrever, executar."
      - "chmod 600 = dono lê e escreve; mais ninguém vê nada."
      - "É o que o SSH EXIGE de uma chave privada. Senão ele recusa usar."
      - "Nunca rode a aplicação como root. O Dockerfile já cuida disso."

  - tipo: codigo
    titulo: "FIREWALL"
    codigo: |
      sudo ufw default deny incoming    # nada entra...
      sudo ufw default allow outgoing   # ...mas a máquina pode sair

      sudo ufw allow 22/tcp             # SSH
      sudo ufw allow 80/tcp             # HTTP
      sudo ufw allow 443/tcp            # HTTPS

      sudo ufw enable
      sudo ufw status verbose

  - tipo: bullets
    titulo: "O QUE ESSE FIREWALL FAZ HOJE"
    bullets:
      - "Nada. A sua VM não está na internet."
      - "Você está aprendendo o gesto."
      - "Numa VPS, ele é o que separa a sua máquina de um scanner."
      - "- que bate na porta 22 a cada poucos segundos, desde o minuto zero"
      - "E lá são DOIS firewalls: o ufw dentro, e o do provedor fora."
      - "- o de fora importa mais: o pacote nem chega"
    notas: |
      Ser honesto aqui compra credibilidade para o resto da aula. Eles
      percebem quando a gente finge que um exercício é uma proteção.

  - tipo: bullets  # EXTRA
    titulo: "VARIÁVEL DE AMBIENTE"
    bullets:
      - "Um par nome=valor que o sistema operacional entrega ao processo."
      - "export JWT_SECRET=abc123 e o programa lê com ENV['JWT_SECRET']."
      - "Por que não deixar no código? Porque o código vai para o Git."
      - "Mesmo código, ambientes diferentes, valores diferentes."
      - "É o padrão dos 12 fatores, e é como o Kamal injeta segredo no container."

  - tipo: codigo
    titulo: "DOCKER, DO REPOSITÓRIO OFICIAL"
    codigo: |
      # O apt install docker.io do Ubuntu instala versão velha.

      sudo install -m 0755 -d /etc/apt/keyrings
      sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
        -o /etc/apt/keyrings/docker.asc
      sudo chmod a+r /etc/apt/keyrings/docker.asc

      # (adiciona o repositório — ver docs/04-deploy.md)

      sudo apt install -y docker-ce docker-ce-cli containerd.io \
        docker-buildx-plugin docker-compose-plugin

      sudo usermod -aG docker ubuntu
      exit   # grupo só vale em sessão nova

  - tipo: bullets
    titulo: "SWAP"
    bullets:
      - "scripts/server-swap.sh cria 2 GiB e persiste no boot."
      - "Rails e Postgres juntos numa máquina pequena estouram a RAM."
      - "O kernel mata o processo que estiver na frente. É o OOM killer."
      - "E a mensagem de erro não explica nada."
      - "A sua VM tem 2 GiB e talvez não precise."
      - "- a VPS de US$5/mês tem 1 GiB, e precisa"

  - tipo: codigo
    titulo: "ENDURECER O SSH"
    codigo: |
      sudo tee /etc/ssh/sshd_config.d/99-hardening.conf >/dev/null <<'EOF'
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      EOF

      sudo sshd -t              # valida a sintaxe ANTES de recarregar
      sudo systemctl reload ssh
    notas: |
      Mantenha a sessão atual aberta e teste em outro terminal. Errar a
      config do SSH com uma sessão só é o jeito clássico de perder a máquina.
      Aqui existe o multipass shell como rede de segurança. Numa VPS, não.

  - tipo: pratica
    titulo: "PRÁTICA 2 — FIREWALL, DOCKER, SWAP, SSH"
    bullets:
      - "ufw: deny incoming, e libere 22, 80 e 443. Depois ufw enable."
      - "Docker do repositório oficial, e usermod -aG docker ubuntu."
      - "SAIA E ENTRE DE NOVO. Grupo só vale em sessão nova."
      - "Swap, pelo scripts/server-swap.sh, do seu notebook."
      - "Endureça o SSH — COM UMA SEGUNDA SESSÃO ABERTA para testar."
      - "Confere: hello-world + free -h com 2,0Gi + ufw active."
      - "Apostila: Prática 2."
    notas: |
      ~30 minutos, o bloco mais longo do dia.
      Duas armadilhas para avisar ANTES: liberar a 22 antes do ufw enable, e
      sair/entrar depois do usermod.
      Diga em voz alta: "aqui vocês têm o multipass shell como rede de
      segurança; numa máquina alugada essa porta não existe."

  - tipo: secao
    titulo: "DOCKER"

  - tipo: bullets
    titulo: "IMAGEM  ×  CONTAINER"
    bullets:
      - "Imagem é a receita: sistema, Ruby, gems e o seu código, congelados."
      - "Container é o bolo: uma instância rodando."
      - "Uma imagem, muitos containers."
      - "Imagem é imutável. Container é descartável."

  - tipo: codigo
    titulo: "O DOCKERFILE DO RAILS"
    codigo: |
      FROM ruby:3.4.9-slim AS base

      FROM base AS build
      RUN apt-get install -y build-essential libpq-dev
      COPY Gemfile Gemfile.lock ./
      RUN bundle install
      COPY . .

      FROM base
      RUN groupadd --system --gid 1000 rails && \
          useradd rails --uid 1000 --gid 1000
      USER 1000:1000
      COPY --from=build "${BUNDLE_PATH}" "${BUNDLE_PATH}"
      COPY --from=build /rails /rails

  - tipo: bullets
    titulo: "DUAS DECISÕES DO DOCKERFILE"
    bullets:
      - "Multi-stage: o estágio build tem compilador; a imagem final não."
      - "- menos peso, e menos ferramenta à mão de quem invadir"
      - "Usuário não-root: se escaparem da aplicação, caem sem privilégio."
      - "- é uma linha que muda o tamanho do estrago"
      - ".dockerignore: sem ele, o histórico do Git vai junto na imagem."

  - tipo: bullets
    titulo: "REGISTRY"
    bullets:
      - "É o 'GitHub das imagens'. Usamos o ghcr.io."
      - "O fluxo: o seu notebook builda, empurra pro ghcr.io,"
      - "- e a VM puxa de lá e roda."
      - "A imagem não viaja pela sua rede local: sobe pro GitHub e desce."
      - "É o que aconteceria com uma VPS do outro lado do mundo."
      - "- e é o que faz o mesmo deploy.yml servir nos dois casos"

  - tipo: bullets
    titulo: "O TOKEN E A ARQUITETURA"
    bullets:
      - "Fora do Actions não existe GITHUB_TOKEN."
      - "Crie um PAT (classic) com write:packages e read:packages."
      - "- escopo de pacote e nada mais: quando vazar, o estrago tem tamanho"
      - "A imagem builda no seu notebook e roda na VM: mesma arquitetura."
      - "Intel ou AMD: SERVER_ARCH=amd64"
      - "Mac M1/M2/M3/M4: SERVER_ARCH=arm64"

  - tipo: pratica
    titulo: "PRÁTICA 3 — ARQUIVOS DE DEPLOY E O TOKEN"
    bullets:
      - "rsync -aR do gabarito aula-04. O -R não é detalhe."
      - "- sem ele, deploy.yml vai para a raiz e o Kamal não acha nada."
      - "bundle install"
      - "Crie o PAT (classic) no GitHub: write:packages e read:packages."
      - "Ele é mostrado UMA VEZ. Guarde agora."
      - "Confere: ls config/deploy.yml .kamal/secrets .env.example"
      - "Apostila: Prática 3."
    notas: |
      ~15 minutos.
      Cobre o tipo do token: fine-grained NÃO funciona no ghcr.io, tem que
      ser classic. É meia hora perdida se ninguém avisar.
      Circule também na arquitetura: quem tem Mac M precisa de arm64.

  - tipo: secao
    titulo: "KAMAL"

  - tipo: bullets
    titulo: "O QUE O KAMAL FAZ"
    bullets:
      - "Feito pela mesma turma do Rails. Deploy com Docker, via SSH."
      - "Sem agente na máquina, sem painel."
      - "Ele conecta na sua VM e roda docker."
      - "Zero-downtime: sobe o novo AO LADO do antigo."
      - "Espera o health check passar, aí troca o tráfego."
      - "Falhou o health check? Não troca. O antigo continua servindo."

  - tipo: codigo
    titulo: "DEPLOY.YML — SERVIDOR E IMAGEM"
    codigo: |
      service: automic-auth-api
      image: <%= ENV.fetch("GHCR_USER") %>/automic-auth-api

      ssh:
        user: <%= ENV.fetch("KAMAL_SSH_USER", "ubuntu") %>

      servers:
        web:
          hosts:
            - <%= ENV.fetch("SERVER_IP") %>

      # O arquivo é ERB. Por isso ele é IGUAL para toda a turma,
      # e o MESMO na VM local e numa VPS. Muda a variável.

  - tipo: codigo
    titulo: "DEPLOY.YML — ENV"
    codigo: |
      env:
        clear:
          SOLID_QUEUE_IN_PUMA: "true"
          WEB_CONCURRENCY: "1"
          DB_HOST: automic-auth-api-db
        secret:
          - RAILS_MASTER_KEY
          - JWT_SECRET

  - tipo: bullets
    titulo: "CLEAR  ×  SECRET"
    bullets:
      - "clear vai como texto no comando docker run. É configuração."
      - "secret vai por arquivo de ambiente, com permissão restrita."
      - "JWT_SECRET no clear seria o mesmo que publicá-lo:"
      - "- apareceria em docker inspect e no histórico do shell"
      - "DB_HOST é o NOME do container do banco."
      - "- containers na mesma rede Docker se enxergam por nome"

  - tipo: codigo
    titulo: "O BANCO COMO ACCESSORY"
    codigo: |
      accessories:
        db:
          image: postgres:16
          host: <%= ENV.fetch("SERVER_IP") %>
          env:
            clear:
              POSTGRES_USER: automic_auth_api
              POSTGRES_DB: automic_auth_api_production
            secret:
              - POSTGRES_PASSWORD
          directories:
            - data:/var/lib/postgresql/data

  - tipo: bullets
    titulo: "ACCESSORY E VOLUME"
    bullets:
      - "Accessory é container que o Kamal gerencia, mas não faz deploy junto."
      - "directories cria o volume."
      - "É o volume que faz os dados sobreviverem a deploy e a rebuild."
      - "Sem ele, cada deploy apagaria o banco."
      - "kamal deploy NÃO sobe accessories."
      - "- depois de mudar env: kamal accessory reboot db"

  - tipo: codigo
    titulo: "AS TRÊS CAMADAS DE SEGREDO"
    codigo: |
      o seu shell (source .env)
              ↓  variáveis de ambiente na sua sessão
      .kamal/secrets
              ↓  só referencia — nenhum valor, por isso vai pro Git
      config/deploy.yml (env.secret)
              ↓  o Kamal injeta no container
      ENV["JWT_SECRET"] no Rails

      # No pipeline, a primeira camada vira Secrets do Actions.
      # As outras três não mudam nada.

  - tipo: bullets
    titulo: "CREDENTIALS  ×  ENV"
    bullets:
      - "bin/rails credentials:edit abre um YAML criptografado."
      - "credentials.yml.enc é seguro no Git; master.key nunca vai."
      - "Credentials: segredo estável e do app (chave de API de terceiro)."
      - "ENV: o que muda por ambiente ou máquina (senha do banco, SMTP)."
      - "Gere o JWT_SECRET com: bin/rails secret"
      - "O seu .env junta tudo. E ele é o arquivo que não pode vazar."

  - tipo: pratica
    titulo: "PRÁTICA 4 — O .ENV"
    bullets:
      - "cp .env.example .env, preencha tudo, e source .env"
      - "SERVER_ARCH: rode dpkg --print-architecture na VM e use o que sair."
      - "RAILS_MASTER_KEY é o CONTEÚDO de config/master.key."
      - "Confere: git status NÃO pode mostrar o .env."
      - "Confere: bundle exec kamal config roda sem erro."
      - "Apostila: Prática 4."
    notas: |
      ~15 minutos, e errar aqui é o que causa quase toda falha da Prática 6.
      Pare a turma no git status. Se o .env aparecer para alguém, conserte o
      .gitignore ANTES de qualquer commit — segredo commitado não sai do
      histórico apagando o arquivo.
      Lembre que source .env vale só naquele shell.

  - tipo: secao
    titulo: "TLS"

  - tipo: bullets  # EXTRA
    titulo: "HTTPS É HTTP DENTRO DE UM TÚNEL"
    bullets:
      - "O HTTP da Aula 1 é texto puro: quem estiver no caminho lê tudo."
      - "O TLS embrulha esse texto num túnel criptografado."
      - "Mesmo protocolo, mesmos verbos, mesmos cabeçalhos, só que fechado."
      - "O 'S' de HTTPS é isso, e mais nada."

  - tipo: bullets  # EXTRA
    titulo: "O HANDSHAKE, EM TRÊS PASSOS"
    bullets:
      - "1. O servidor apresenta o certificado dele."
      - "2. O cliente confere se confia em QUEM ASSINOU aquele certificado."
      - "3. Os dois combinam uma chave temporária e conversam com ela."
      - "As chaves do par (assimétricas) só servem para o passo 3."
      - "- depois disso é criptografia simétrica, que é muito mais rápida."

  - tipo: bullets
    titulo: "CERTIFICADO E AUTORIDADE"
    bullets:
      - "Um certificado diz: 'esta chave pública pertence a este domínio'."
      - "E vem assinado por uma Autoridade Certificadora (CA)."
      - "O seu navegador já nasce com uma lista de CAs em que confia."
      - "Confia na CA → confia em quem ela assinou. É uma cadeia."
      - "Autoassinado é você jurando que é você."
      - "Para uma CA pública assinar, você tem que PROVAR que o domínio é seu."
    notas: |
      É a deixa para o certificado autoassinado: eles não têm domínio
      nenhum apontando para a VM, então não tem como provar nada. E é
      exatamente isso que vamos ver na tela daqui a três slides.

  - tipo: bullets  # EXTRA
    titulo: "PROXY REVERSO"
    bullets:
      - "Proxy comum fica na frente do CLIENTE. Reverso fica na frente do SERVIDOR."
      - "Recebe tudo na 443, termina o TLS, e repassa para a app em HTTP interno."
      - "Assim o Rails não precisa saber nada de certificado."
      - "É o kamal-proxy, rodando na sua VM."
      - "Por isso config.assume_ssl: avisa o Rails que o 'http' que chegou"
      - "- já veio de um https lá fora."

  - tipo: codigo
    titulo: "GERAR O CERTIFICADO"
    codigo: |
      openssl req -x509 -newkey rsa:2048 -sha256 -days 365 -nodes \
        -keyout tls/capacita-key.pem -out tls/capacita-cert.pem \
        -subj "/CN=seunome.test" \
        -addext "subjectAltName=DNS:seunome.test"

      # O subjectAltName não é opcional.
      # Cliente moderno nenhum olha só o CN: sem SAN,
      # o certificado é inválido mesmo estando certo.

  - tipo: codigo
    titulo: ".TEST E O /ETC/HOSTS"
    codigo: |
      echo "SEU_IP  seunome.test" | sudo tee -a /etc/hosts
      getent hosts seunome.test

      # .test é um domínio RESERVADO para testes (RFC 6761).
      # Ninguém consegue registrar, então nunca colide com
      # um site de verdade.
      #
      # Quem resolve o nome é o /etc/hosts, que o sistema
      # consulta ANTES de perguntar ao DNS.
    notas: |
      Windows: repetir no C:\Windows\System32\drivers\etc\hosts, com o
      Bloco de Notas como administrador. É esse que o navegador consulta.

  - tipo: codigo
    titulo: "AUTOASSINADO, NA PRÁTICA"
    codigo: |
      curl https://seunome.test/api/v1/status
      # curl: (60) SSL certificate problem: self signed certificate
      # O TÚNEL SUBIU. O que falhou foi a CONFIANÇA.

      curl -k https://seunome.test/api/v1/status
      # funciona. -k = criptografa, mas não confere quem é.

      curl --cacert tls/capacita-cert.pem https://seunome.test/...
      # funciona, CONFERINDO. Você não desligou nada:
      # você disse ao curl em quem confiar.
    notas: |
      O slide da aula. Uma CA é exatamente isso: alguém em quem o seu
      sistema já decidiu confiar, de fábrica. O Let's Encrypt não tem
      mágica que o openssl deles não tenha. Tem o navegador do mundo
      inteiro com a chave dele na lista.

  - tipo: pratica
    titulo: "PRÁTICA 5 — CERTIFICADO E /ETC/HOSTS"
    bullets:
      - "openssl req -x509 ... -addext \"subjectAltName=DNS:seunome.test\""
      - "O subjectAltName NÃO é opcional. Sem ele, nenhum cliente aceita."
      - "echo \"SEU_IP  seunome.test\" | sudo tee -a /etc/hosts"
      - "Confere: getent hosts seunome.test devolve o IP da VM."
      - "Windows: repita no hosts do WINDOWS, é ele que o navegador lê."
      - "Apostila: Prática 5."
    notas: |
      ~15 minutos.
      .test é reservado por RFC para testes: ninguém consegue registrar, e
      por isso nunca colide com um site real. Vale a curiosidade.

  - tipo: secao
    titulo: "DEPLOY"

  - tipo: bullets
    titulo: "CI: O PORTÃO"
    bullets:
      - "Roda em todo push e todo pull request."
      - "scan_ruby: Brakeman e bundler-audit. lint: RuboCop."
      - "test: bin/rails test contra um Postgres descartável."
      - "Falhou qualquer um, não entra na main."
      - "Não depende de onde o servidor mora."
      - "Servidor sem CI publica bug automaticamente. CI sem servidor te avisa."

  - tipo: codigo
    titulo: "O PRIMEIRO DEPLOY"
    codigo: |
      source .env
      bundle exec kamal config     # valida sem tocar em nada

      bundle exec kamal setup      # só na primeira vez

      curl --cacert tls/capacita-cert.pem \
        https://seunome.test/api/v1/status

      {"status":"ok","service":"automic-auth-api",
       "environment":"production"}

      # daqui pra frente: source .env && kamal deploy
    notas: |
      O momento da aula. O código deles está rodando num container, num
      Ubuntu que eles provisionaram, atrás de um proxy TLS, com um Postgres
      com volume. Em produção, é isto.

  - tipo: codigo
    titulo: "OPERAR"
    codigo: |
      source .env

      kamal app logs -f
      kamal app exec --interactive --reuse "bin/rails console"
      kamal app exec "bin/rails db:migrate"
      kamal app details
      kamal accessory reboot db
      kamal rollback

      multipass stop servidor    # libera RAM do notebook

  - tipo: bullets
    titulo: "BACKUP"
    bullets:
      - "Volume Docker NÃO é backup. Se a VM sumir, o volume some junto."
      - "E aqui a VM some com um multipass delete."
      - "- demonstração barata de um susto caro"
      - "pg_dump pela SSH, compactado, guardado fora da máquina."
      - "E o que quase ninguém faz: restaure num banco de teste."
      - "Backup que nunca foi restaurado não é backup, é esperança."

  - tipo: pratica
    titulo: "PRÁTICA 6 — O PRIMEIRO DEPLOY"
    bullets:
      - "source .env  ·  bundle exec kamal config  (valida sem tocar em nada)"
      - "bundle exec kamal setup   — só na primeira vez."
      - "Confere: curl --cacert tls/capacita-cert.pem https://seunome.test/..."
      - "{\"status\":\"ok\", ..., \"environment\":\"production\"}"
      - "Apostila: Prática 6, com a maior tabela de erros da capacitação."
    notas: |
      ~25 minutos, sendo ~5 de build. É o momento da aula.
      Use a espera do build para o bloco de backup e para perguntas.
      Quando aparecer, diga o que está na frente deles: o código deles
      rodando num container, num Ubuntu que eles provisionaram, atrás de um
      proxy TLS, com um Postgres com volume. Isto é produção.

  - tipo: pratica
    titulo: "PRÁTICA 7 — O CERTIFICADO, COM OS OLHOS"
    bullets:
      - "curl https://seunome.test/...   ->  FALHA: self signed certificate"
      - "Isso é o TLS funcionando. O que falhou foi a CONFIANÇA."
      - "curl -k ...   ->  funciona, sem conferir nada."
      - "curl --cacert tls/capacita-cert.pem ...   ->  funciona, CONFERINDO."
      - "Abra no navegador e leia o aviso vermelho."
      - "Escreva a diferença entre o segundo e o terceiro comando."
      - "Apostila: Prática 7."
    notas: |
      ~10 minutos, e é a prática que mais ensina do dia. Não passe rápido.
      A frase que fixa: o -k desliga a conferência; o --cacert não desliga
      nada, ele diz em quem confiar. Uma CA é isso e só isso — alguém em quem
      o seu sistema já decidiu confiar, de fábrica.

  - tipo: secao
    titulo: "E NA NUVEM DE VERDADE"

  - tipo: bullets
    titulo: "O QUE ENTRA QUANDO O IP É PÚBLICO"
    bullets:
      - "A máquina: portal do provedor. Região, tamanho, imagem, cota."
      - "Firewall do provedor, com a 22 aberta só para o seu IP."
      - "DNS de verdade, num domínio seu."
      - "Certificado de uma CA: Let's Encrypt, ou Origin CA atrás do Cloudflare."
      - "Deploy pelo Actions, e não do seu terminal."
      - "Tudo o mais é o que vocês acabaram de fazer."

  - tipo: codigo
    titulo: "A SEQUÊNCIA DO DEPLOY AUTOMÁTICO"
    codigo: |
      1. autentica na nuvem (OIDC)
      2. descobre o próprio IP público
      3. cria regra no firewall liberando a 22 só para esse IP/32
      4. faz o deploy
      5. APAGA a regra — mesmo se o deploy falhar

      # O passo 5 tem `if: always()`.
      #
      # Deixar a 22 aberta é o erro que transforma um deploy ruim
      # num incidente de segurança.

  - tipo: bullets
    titulo: "OIDC"
    bullets:
      - "O jeito comum: criar um client secret e guardar no GitHub."
      - "Ele é longo, vale por meses, e quem lê o repositório entra na sua nuvem."
      - "OIDC inverte: o GitHub emite um token curto a cada execução."
      - "Ele diz: 'sou o workflow do repositório X, na branch main'."
      - "A nuvem verifica e devolve um acesso temporário."
      - "Não existe segredo de longa duração em lugar nenhum."
    notas: |
      Isto é demonstração, não exercício. O passo a passo completo está em
      docs/apendice-azure.md, para eles fazerem em casa com a Azure for
      Students.

  - tipo: pratica
    titulo: "PRÁTICA 8 — O SISTEMA INTEIRO, E O BACKUP"
    bullets:
      - "Refaça o fluxo da Aula 3 contra a SUA API em produção."
      - "- e desta vez o e-mail chega na sua caixa de entrada de verdade."
      - "Mude a rota de status, commite, dê push (o CI roda) e kamal deploy."
      - "kamal app logs -f enquanto acontece: veja o novo subir AO LADO."
      - "Faça um pg_dump pela SSH e confira que o arquivo não está vazio."
      - "multipass stop servidor antes de ir embora."
      - "Apostila: Prática 8."
    notas: |
      ~20 minutos. Fecha a capacitação: o que eles construíram nas Aulas 2 e
      3, rodando em produção.
      O backup é o fecho honesto da aula: volume não é backup, e aqui a VM
      some com um multipass delete. Demonstração barata de um susto caro.


  - tipo: bullets
    titulo: "RECAPITULANDO"
    bullets:
      - "Servidor no notebook ou em datacenter: muda o IP, não o trabalho."
      - "Escolha a ferramenta do tamanho do problema."
      - "Multi-stage e usuário não-root."
      - "clear é configuração, secret é segredo."
      - "Volume salva o dado do deploy. E ainda assim não é backup."
      - "TLS criptografa. CA é confiança. São coisas separadas."
      - "Numa máquina exposta, firewall e segredo curto deixam de ser detalhe."

  - tipo: bullets
    titulo: "O QUE O SEEM-BACKEND TEM A MAIS"
    bullets:
      - "Datadog: logs centralizados e Error Tracking."
      - "rack-attack: bloqueia scanner e rajada de erro por IP."
      - "Active Storage: foto de perfil em volume persistente."
      - "Audit log: histórico de toda mutação de admin."
      - "Export .xlsx e OpenAPI/Swagger."
      - "Nenhum é difícil depois do que você viu. Agora dá para ler o código."

  - tipo: bullets
    titulo: "O QUE VOCÊS FIZERAM"
    bullets:
      - "Uma API REST com cinco fluxos de autenticação. Testada."
      - "Senha hasheada, token assinado, sessão revogável de verdade."
      - "Um servidor Linux provisionado por vocês: firewall, Docker, SSH."
      - "Deploy com zero-downtime, HTTPS, banco com volume e backup."
      - "Do zero. Em quatro encontros."
      - "Está tudo no GitHub de vocês. É portfólio."
    notas: |
      Reserve os cinco minutos e leia isto devagar, olhando para eles.
      Quem fez raramente percebe o tamanho do que fez — o esforço esconde a
      conquista. Este slide existe para devolver a perspectiva.

  - tipo: bullets
    titulo: "E AGORA?"
    bullets:
      - "O seem-backend está aberto. Agora vocês conseguem ler."
      - "Peguem uma coisa da lista anterior e implementem no projeto de vocês."
      - "Alugem uma VPS de verdade quando quiserem: o apêndice tem o caminho."
      - "- e o deploy.yml é o mesmo. Muda uma variável."
      - "Dúvida daqui a três semanas ainda é dúvida. Podem me chamar."
    notas: |
      Deixe o canal aberto de verdade, e diga isso em voz alta. A pergunta
      que chega três semanas depois costuma ser a mais importante da
      capacitação inteira, porque é a primeira que veio de um problema real
      deles.

  - tipo: fim
    titulo: "MUITO OBRIGADO!"
    corpo: |
      BONS ESTUDOS
