aula: 4
titulo: "VPS, Docker, Kamal e deploy"

# Slides marcados com "# CORTÁVEL" cobrem pré-requisitos (Linux).

slides:
  - tipo: capa
    titulo: "VPS, Docker, Kamal\ne Deploy"
    corpo: |
      Capacitação Back-end
      Aula 4 de 4

      Fabrício Siqueira

  - tipo: objetivos
    titulo: "OBJETIVOS"
    bullets:
      - "Subir a sua própria máquina na nuvem."
      - "Entender Docker e Kamal de verdade."
      - "Colocar a sua API no ar, com HTTPS."
      - "Deploy automático a cada push."

  - tipo: secao
    titulo: "VPS"

  - tipo: bullets
    titulo: "O QUE É UMA VPS"
    bullets:
      - "Virtual Private Server."
      - "Um computador virtual dentro do servidor físico de um provedor."
      - "É seu: acesso root, escolhe o sistema, instala o que quiser."
      - "Cobra por hora ligada, não por uso."

  - tipo: bullets
    titulo: "AS QUATRO OPÇÕES"
    bullets:
      - "Hospedagem compartilhada: você não controla nada."
      - "PaaS (Heroku, Render, Fly): controla o app, opera nada."
      - "- paga mais e obedece as regras deles"
      - "VPS: controla tudo, e opera tudo."
      - "Kubernetes: controla tudo, em escala, e opera muito mais."

  - tipo: bullets
    titulo: "POR QUE VM, E NÃO KUBERNETES"
    bullets:
      - "O seem-backend atende ~500 usuários num evento de uma semana."
      - "Kubernetes adicionaria custo e operação sem resolver problema nenhum."
      - "Menos peças para monitorar."
      - "Deploy reproduzível com Docker e Kamal."
      - "Banco e aplicação perto um do outro."
      - "Evoluir só quando uma métrica real pedir."
    notas: |
      Escolher a ferramenta grande antes do problema grande é a forma mais
      cara de errar. Vale insistir nisso.

  - tipo: bullets
    titulo: "E O QUE ISSO CUSTA"
    bullets:
      - "Uma VM é ponto único de falha."
      - "Volume Docker não é backup."
      - "O Postgres não é gerenciado: quem cuida é você."
      - "Admitir o custo faz parte da decisão."

  - tipo: secao
    titulo: "A MÁQUINA"

  - tipo: bullets
    titulo: "COTAS ANTES DE TUDO"
    bullets:
      - "A Azure for Students não oferece todo tamanho em toda região."
      - "O portal responde: NotAvailableForSubscription"
      - "Assinaturas → Uso + cotas → filtre por Compute"
      - "Escolha uma região onde o tamanho aparece."
      - "Não insista: pedir aumento de cota não resolve oferta desabilitada."

  - tipo: bullets
    titulo: "CRIANDO A VM"
    bullets:
      - "Ubuntu Server 24.04 LTS: x64 Gen2"
      - "Standard_B1s (1 vCPU, 1 GiB) ou maior, se houver crédito"
      - "Autenticação: chave pública SSH, tipo Ed25519"
      - "Usuário: azureuser"
      - "Portas públicas de entrada: NENHUMA"

  - tipo: bullets
    titulo: "'NENHUMA' É A ESCOLHA MAIS IMPORTANTE DA TELA"
    bullets:
      - "O assistente, se deixado, libera SSH para a internet inteira."
      - "Bots varrem a porta 22 do IPv4 todo, o dia todo."
      - "Vamos abrir a 22 só para o seu IP."
      - "curl -4 ifconfig.me descobre qual é."
      - "O /32 na regra significa 'exatamente este endereço'."

  - tipo: bullets  # EXTRA
    titulo: "DUAS CHAVES, UM PAR"
    bullets:
      - "Criptografia assimétrica: duas chaves que se completam."
      - "A PÚBLICA você espalha. A PRIVADA nunca sai da sua máquina."
      - "O que uma fecha, só a outra abre."
      - "Duas coisas saem daí:"
      - "- sigilo: fecho com a sua pública, só você abre"
      - "- assinatura: fecho com a minha privada, todos conferem que fui eu"

  - tipo: bullets  # EXTRA
    titulo: "É COMO O SSH FUNCIONA"
    bullets:
      - "Você põe a sua chave PÚBLICA no servidor (authorized_keys)."
      - "Ao conectar, o servidor manda um desafio."
      - "Você responde assinando com a PRIVADA."
      - "O servidor confere com a pública que já tinha. Entrou."
      - "A senha nunca trafega. Nem existe."
      - "É por isso que perder a chave privada é perder o acesso."
    notas: |
      Mesma matemática da assinatura do JWT da Aula 3 — lá é chave simétrica
      (HS256), aqui é par de chaves. Vale fazer a ponte.

  - tipo: codigo
    titulo: "A CHAVE PRIVADA"
    codigo: |
      mkdir -p ~/.ssh
      mv ~/Downloads/vm-capacita_key.pem ~/.ssh/azure-capacita
      chmod 600 ~/.ssh/azure-capacita

      ssh -i ~/.ssh/azure-capacita azureuser@SEU_IP

      # chmod 600 = só você lê.
      # O SSH RECUSA usar chave com permissão frouxa.
    notas: |
      O portal oferece o download uma vez só. Chave privada não vai por
      e-mail, não vai por WhatsApp, não vai para o Git.

  - tipo: secao
    titulo: "UBUNTU"

  - tipo: bullets
    titulo: "LINUX BÁSICO"  # CORTÁVEL
    bullets:
      - "apt update / apt install: o gerenciador de pacotes"
      - "sudo: executar como root, uma vez"
      - "systemctl status / restart: serviços"
      - "journalctl -u ssh: logs de um serviço"
      - "free -h e df -h: memória e disco"
      - "chmod 600 arquivo: só o dono lê e escreve"

  - tipo: bullets  # EXTRA
    titulo: "ROOT E PERMISSÕES"
    bullets:
      - "root é o usuário que pode tudo. Não tem 'tem certeza?'."
      - "Você trabalha como azureuser e chama sudo quando precisa."
      - "Todo arquivo tem dono, grupo e três permissões: ler, escrever, executar."
      - "chmod 600 = dono lê e escreve; mais ninguém vê nada."
      - "É o que o SSH EXIGE de uma chave privada. Senão ele recusa usar."
      - "Nunca rode a aplicação como root. O Dockerfile já cuida disso."

  - tipo: bullets  # EXTRA
    titulo: "VARIÁVEL DE AMBIENTE"
    bullets:
      - "Um par nome=valor que o sistema operacional entrega ao processo."
      - "export JWT_SECRET=abc123 e o programa lê com ENV['JWT_SECRET']."
      - "Por que não deixar no código? Porque o código vai para o Git."
      - "Mesmo código, ambientes diferentes, valores diferentes."
      - "É o padrão dos 12 fatores, e é como o Kamal injeta segredo no container."

  - tipo: codigo
    titulo: "DOCKER, DO REPOSITÓRIO OFICIAL"
    codigo: |
      # O apt install docker.io do Ubuntu instala versão velha.

      sudo install -m 0755 -d /etc/apt/keyrings
      sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
        -o /etc/apt/keyrings/docker.asc
      sudo chmod a+r /etc/apt/keyrings/docker.asc

      # (adiciona o repositório — ver docs/04-deploy.md)

      sudo apt install -y docker-ce docker-ce-cli containerd.io \
        docker-buildx-plugin docker-compose-plugin

      sudo usermod -aG docker azureuser
      exit   # grupo só vale em sessão nova

  - tipo: bullets
    titulo: "SWAP"
    bullets:
      - "scripts/server-swap.sh cria 2 GiB e persiste no boot."
      - "Numa VM de 1 GiB, Rails + Postgres + build estouram a RAM."
      - "O kernel mata o processo que estiver na frente. É o OOM killer."
      - "E a mensagem de erro não explica nada."
      - "swappiness 10: só usa swap quando a RAM acabar mesmo."

  - tipo: codigo
    titulo: "ENDURECER O SSH"
    codigo: |
      sudo tee /etc/ssh/sshd_config.d/99-hardening.conf >/dev/null <<'EOF'
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      EOF

      sudo sshd -t              # valida a sintaxe ANTES de recarregar
      sudo systemctl reload ssh
    notas: |
      Mantenha a sessão atual aberta e teste em outro terminal. Errar a
      config do SSH com uma sessão só é o jeito clássico de perder a máquina.

  - tipo: secao
    titulo: "DOCKER"

  - tipo: bullets
    titulo: "IMAGEM  ×  CONTAINER"
    bullets:
      - "Imagem é a receita: sistema, Ruby, gems e o seu código, congelados."
      - "Container é o bolo: uma instância rodando."
      - "Uma imagem, muitos containers."
      - "Imagem é imutável. Container é descartável."

  - tipo: codigo
    titulo: "O DOCKERFILE DO RAILS"
    codigo: |
      FROM ruby:3.4.9-slim AS base

      FROM base AS build
      RUN apt-get install -y build-essential libpq-dev
      COPY Gemfile Gemfile.lock ./
      RUN bundle install
      COPY . .

      FROM base
      RUN groupadd --system --gid 1000 rails && \
          useradd rails --uid 1000 --gid 1000
      USER 1000:1000
      COPY --from=build "${BUNDLE_PATH}" "${BUNDLE_PATH}"
      COPY --from=build /rails /rails

  - tipo: bullets
    titulo: "DUAS DECISÕES DO DOCKERFILE"
    bullets:
      - "Multi-stage: o estágio build tem compilador; a imagem final não."
      - "- menos peso, e menos ferramenta à mão de quem invadir"
      - "Usuário não-root: se escaparem da aplicação, caem sem privilégio."
      - "- é uma linha que muda o tamanho do estrago"
      - ".dockerignore: sem ele, o histórico do Git vai junto na imagem."

  - tipo: bullets
    titulo: "REGISTRY"
    bullets:
      - "É o 'GitHub das imagens'."
      - "Usamos o ghcr.io: já vem com a conta do GitHub."
      - "O Actions autentica sozinho com o GITHUB_TOKEN."
      - "O fluxo: Actions builda → empurra pro ghcr.io → a VM puxa e roda."
      - "A sua máquina nunca faz o build de produção."

  - tipo: secao
    titulo: "KAMAL"

  - tipo: bullets
    titulo: "O QUE O KAMAL FAZ"
    bullets:
      - "Feito pela mesma turma do Rails. Deploy com Docker, via SSH."
      - "Sem agente na máquina, sem painel."
      - "Ele conecta na sua VM e roda docker."
      - "Zero-downtime: sobe o novo AO LADO do antigo."
      - "Espera o health check passar, aí troca o tráfego."
      - "Falhou o health check? Não troca. O antigo continua servindo."

  - tipo: codigo
    titulo: "DEPLOY.YML — SERVIDOR E IMAGEM"
    codigo: |
      service: automic-auth-api
      image: <%= ENV.fetch("GHCR_USER") %>/automic-auth-api

      ssh:
        user: azureuser
      run_directory: /home/azureuser/.kamal

      servers:
        web:
          hosts:
            - <%= ENV.fetch("AZURE_VM_IP") %>

      # O arquivo é ERB. Por isso ele é IGUAL para toda a turma:
      # o que muda vem das variables do Actions.

  - tipo: codigo
    titulo: "DEPLOY.YML — ENV"
    codigo: |
      env:
        clear:
          SOLID_QUEUE_IN_PUMA: "true"
          WEB_CONCURRENCY: "1"
          DB_HOST: automic-auth-api-db
        secret:
          - RAILS_MASTER_KEY
          - JWT_SECRET

  - tipo: bullets
    titulo: "CLEAR  ×  SECRET"
    bullets:
      - "clear vai como texto no comando docker run. É configuração."
      - "secret vai por arquivo de ambiente, com permissão restrita."
      - "JWT_SECRET no clear seria o mesmo que publicá-lo:"
      - "- apareceria em docker inspect e no histórico do shell"
      - "DB_HOST é o NOME do container do banco."
      - "- containers na mesma rede Docker se enxergam por nome"

  - tipo: codigo
    titulo: "O BANCO COMO ACCESSORY"
    codigo: |
      accessories:
        db:
          image: postgres:16
          host: <%= ENV.fetch("AZURE_VM_IP") %>
          env:
            clear:
              POSTGRES_USER: automic_auth_api
              POSTGRES_DB: automic_auth_api_production
            secret:
              - POSTGRES_PASSWORD
          directories:
            - data:/var/lib/postgresql/data

  - tipo: bullets
    titulo: "ACCESSORY E VOLUME"
    bullets:
      - "Accessory é container que o Kamal gerencia, mas não faz deploy junto."
      - "directories cria o volume."
      - "É o volume que faz os dados sobreviverem a deploy e a rebuild."
      - "Sem ele, cada deploy apagaria o banco."
      - "kamal deploy NÃO sobe accessories."
      - "- depois de mudar env: kamal accessory reboot db"

  - tipo: codigo
    titulo: "AS TRÊS CAMADAS DE SEGREDO"
    codigo: |
      GitHub Actions Secrets
              ↓  viram variáveis de ambiente no runner
      .kamal/secrets
              ↓  só referencia — nenhum valor, por isso vai pro Git
      config/deploy.yml (env.secret)
              ↓  o Kamal injeta no container
      ENV["JWT_SECRET"] no Rails

      # Nenhum valor real toca o repositório em ponto nenhum.

  - tipo: bullets
    titulo: "CREDENTIALS  ×  ENV"
    bullets:
      - "bin/rails credentials:edit abre um YAML criptografado."
      - "credentials.yml.enc é seguro no Git; master.key nunca vai."
      - "Credentials: segredo estável e do app (chave de API de terceiro)."
      - "ENV: o que muda por ambiente ou máquina (senha do banco, SMTP)."
      - "Gere o JWT_SECRET com: bin/rails secret"

  - tipo: secao
    titulo: "CI/CD"

  - tipo: bullets
    titulo: "CI: O PORTÃO"
    bullets:
      - "Roda em todo push e todo pull request."
      - "scan_ruby: Brakeman e bundler-audit."
      - "lint: RuboCop."
      - "test: bin/rails test contra um Postgres descartável."
      - "Falhou qualquer um, não entra na main."
      - "É isso que faz 'deploy automático' não ser 'publicar bug automático'."

  - tipo: bullets
    titulo: "DEPLOY: O PONTO DELICADO"
    bullets:
      - "A porta 22 está fechada para a internet."
      - "O runner do GitHub tem IP diferente a cada execução."
      - "Não dá para liberar antes."

  - tipo: codigo
    titulo: "A SEQUÊNCIA"
    codigo: |
      1. autentica na Azure (OIDC)
      2. descobre o próprio IP público
      3. cria regra no NSG liberando a 22 só para esse IP/32
      4. faz o deploy
      5. APAGA a regra — mesmo se o deploy falhar

      # O passo 5 tem `if: always()`.
      #
      # Deixar a 22 aberta é o erro que transforma um deploy ruim
      # num incidente de segurança.

  - tipo: secao
    titulo: "OIDC"

  - tipo: bullets
    titulo: "POR QUE NÃO USAR SENHA"
    bullets:
      - "O jeito comum: criar um client secret e guardar no GitHub."
      - "Ele é longo, vale por meses."
      - "E quem tiver acesso ao repositório tem acesso à sua Azure."

  - tipo: bullets
    titulo: "OIDC INVERTE"
    bullets:
      - "O GitHub emite, a cada execução, um token de curta duração."
      - "Ele diz: 'sou o workflow do repositório X, na branch Y'."
      - "A Azure verifica e devolve um acesso temporário."
      - "Não existe segredo de longa duração em lugar nenhum."

  - tipo: codigo
    titulo: "A CREDENCIAL FEDERADA"
    codigo: |
      # Microsoft Entra ID → Registros de aplicativo → Novo registro
      # NÃO crie segredo do cliente.
      #
      # Credenciais federadas → cenário GitHub Actions:

      repo:SEU-USUARIO/SEU-REPO:ref:refs/heads/main

      # Precisa bater CARACTERE POR CARACTERE.
      # Erro de maiúscula, de nome ou de branch dá AADSTS700213
      # — e a mensagem não ajuda em nada.

  - tipo: bullets
    titulo: "PERMISSÃO MÍNIMA"
    bullets:
      - "A atribuição de função vai no NSG, não na assinatura."
      - "Função: Colaborador de Rede."
      - "Se a credencial vazar, o estrago se limita a regras de firewall."
      - "- daquela máquina, e só."
      - "A chave SSH do CI também é separada da sua."
      - "- dá para revogar o acesso do CI sem trocar o seu"

  - tipo: secao
    titulo: "TLS"

  - tipo: bullets  # EXTRA
    titulo: "HTTPS É HTTP DENTRO DE UM TÚNEL"
    bullets:
      - "O HTTP da Aula 1 é texto puro: quem estiver no caminho lê tudo."
      - "O TLS embrulha esse texto num túnel criptografado."
      - "Mesmo protocolo, mesmos verbos, mesmos cabeçalhos, só que fechado."
      - "O 'S' de HTTPS é isso, e mais nada."

  - tipo: bullets  # EXTRA
    titulo: "O HANDSHAKE, EM TRÊS PASSOS"
    bullets:
      - "1. O servidor apresenta o certificado dele."
      - "2. O cliente confere se confia em quem assinou aquele certificado."
      - "3. Os dois combinam uma chave temporária e conversam com ela."
      - "As chaves do par (assimétricas) só servem para o passo 3."
      - "- depois disso é criptografia simétrica, que é muito mais rápida."

  - tipo: bullets  # EXTRA
    titulo: "CERTIFICADO E AUTORIDADE"
    bullets:
      - "Um certificado diz: 'esta chave pública pertence a este domínio'."
      - "E vem assinado por uma Autoridade Certificadora (CA)."
      - "O seu navegador já nasce com uma lista de CAs em que confia."
      - "Confia na CA → confia em quem ela assinou. É uma cadeia."
      - "Autoassinado é você jurando que é você. O navegador não aceita."
      - "Let's Encrypt é uma CA pública e gratuita. Cloudflare Origin CA não é pública."

  - tipo: bullets  # EXTRA
    titulo: "PROXY REVERSO"
    bullets:
      - "Proxy comum fica na frente do CLIENTE. Reverso fica na frente do SERVIDOR."
      - "Recebe tudo na 443, termina o TLS, e repassa para a app em HTTP interno."
      - "Assim o Rails não precisa saber nada de certificado."
      - "É o kamal-proxy na sua VM: e o Cloudflare, uma camada antes."
      - "Por isso config.assume_ssl: avisa o Rails que o 'http' que chegou"
      - "- já veio de um https lá fora."

  - tipo: bullets
    titulo: "DNS NO CLOUDFLARE"
    bullets:
      - "Registro A, apontando para o IP público da VM."
      - "Proxy: Proxied, a nuvem laranja."
      - "O tráfego passa pelo Cloudflare antes de chegar na sua VM."
      - "Cache, proteção contra DDoS,"
      - "- e o IP real da sua máquina não aparece no DNS."

  - tipo: bullets
    titulo: "OS TRÊS MODOS DE TLS"
    bullets:
      - "Flexible: Cloudflare → sua VM em TEXTO PURO. Não use."
      - "Full: criptografado, mas aceita certificado inválido."
      - "Full (strict): criptografado E o certificado é validado."
      - "Com Flexible, o cadeado aparece e a senha trafega em claro no fim."
      - "É pior que não ter HTTPS, porque mente."

  - tipo: bullets
    titulo: "POR QUE NÃO LET'S ENCRYPT"
    bullets:
      - "O Kamal sabe emitir Let's Encrypt sozinho. Aqui não dá."
      - "Com o DNS proxied, o desafio HTTP-01 não chega como esperado."
      - "Daria para tirar o proxy durante a emissão, mas isso expõe o IP"
      - "- e vira ritual manual a cada renovação."
      - "Origin CA: protege Cloudflare → Azure, sem desafio, e vale anos."
      - "O certificado que o usuário vê é o público do Cloudflare."

  - tipo: secao
    titulo: "DEPLOY"

  - tipo: codigo
    titulo: "O PRIMEIRO DEPLOY"
    codigo: |
      # Valida o deploy.yml sem tocar em nada:
      GHCR_USER=... AZURE_VM_IP=... APP_HOST=... \
        bundle exec kamal config

      # Actions → Deploy (Kamal) → Run workflow → command: setup
      #
      # `setup` instala o Docker se faltar, sobe os accessories
      # e faz o primeiro deploy. Só na primeira vez.

      curl https://seunome.capacita.exemplo.tech/api/v1/status

  - tipo: codigo
    titulo: "OPERAR"
    codigo: |
      kamal app logs -f
      kamal app exec --interactive --reuse "bin/rails console"
      kamal app exec "bin/rails db:migrate"
      kamal app details
      kamal accessory reboot db
      kamal rollback

  - tipo: bullets
    titulo: "BACKUP"
    bullets:
      - "Volume Docker NÃO é backup. Se a VM sumir, o volume some junto."
      - "pg_dump pela SSH, compactado, guardado fora da máquina."
      - "E o que quase ninguém faz: restaure num banco de teste."
      - "Backup que nunca foi restaurado não é backup, é esperança."

  - tipo: pratica
    titulo: "PRÁTICA — A MÁQUINA"
    bullets:
      - "Crie a VM, sem porta pública nenhuma."
      - "Abra a 22 só para o seu IP, mais 80 e 443."
      - "Instale o Docker e rode o hello-world."
      - "Rode o server-swap.sh e endureça o SSH."

  - tipo: pratica
    titulo: "PRÁTICA — O DEPLOY"
    bullets:
      - "Configure o OIDC e cadastre secrets e variables."
      - "Crie o DNS e o Origin CA. Ligue o Full (strict)."
      - "Rode o workflow com command: setup."
      - "Faça o fluxo da Aula 3 contra a SUA API em produção."
      - "Mude a rota de status, dê push, e veja o deploy sozinho."

  - tipo: bullets
    titulo: "RECAPITULANDO"
    bullets:
      - "VPS: você controla tudo, e opera tudo."
      - "Escolha a ferramenta do tamanho do problema."
      - "Multi-stage e usuário não-root."
      - "clear é configuração, secret é segredo."
      - "Volume salva o dado do deploy. E ainda assim não é backup."
      - "OIDC troca segredo longo por token curto."
      - "A porta 22 abre por um minuto e fecha, inclusive quando dá errado."

  - tipo: bullets
    titulo: "O QUE O SEEM-BACKEND TEM A MAIS"
    bullets:
      - "Datadog: logs centralizados e Error Tracking."
      - "rack-attack: bloqueia scanner e rajada de erro por IP."
      - "Active Storage: foto de perfil em volume persistente."
      - "Audit log: histórico de toda mutação de admin."
      - "Export .xlsx e OpenAPI/Swagger."
      - "Nenhum é difícil depois do que você viu. Agora dá para ler o código."

  - tipo: fim
    titulo: "MUITO OBRIGADO!"
    corpo: |
      BONS ESTUDOS
