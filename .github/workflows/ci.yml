# Roda a cada push e a cada pull request. Se qualquer job falhar, o deploy não
# acontece — a main só recebe código que passou pelas três checagens.
name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  # Análise estática de segurança: SQL injection, mass assignment, redirect
  # aberto e mais uma dúzia de padrões. Mais gems com CVE conhecido.
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Brakeman
        run: bin/brakeman --no-pager

      - name: bundler-audit
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: RuboCop
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    # Um Postgres de verdade, descartável, só para esta execução.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: automic
          POSTGRES_PASSWORD: automic
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready --health-interval=10s
          --health-timeout=5s --health-retries=3

    steps:
      - name: Instala o cliente do Postgres
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Testes
        env:
          RAILS_ENV: test
          DB_HOST: localhost
          DB_USER: automic
          DB_PASSWORD: automic
        run: bin/rails db:test:prepare test
