# Kamal — deploy da automic-auth-api. Docs: https://kamal-deploy.org
#
# Este arquivo é IGUAL para todo mundo da turma, e é o MESMO na VM local da
# Aula 4 e numa VPS alugada. O que muda vem de variáveis de ambiente:
#
#   GHCR_USER          seu usuário do GitHub (dono da imagem no ghcr.io)
#   SERVER_IP          o IP do servidor (multipass info servidor, ou o IP público da VPS)
#   APP_HOST           o hostname servido, ex.: seunome.test
#   KAMAL_SSH_USER     usuário do SSH no servidor (padrão: ubuntu)
#   SSH_PORT           porta do SSH (padrão: 22; 2222 no plano B do Windows)
#   SERVER_ARCH        amd64 (Intel/AMD) ou arm64 (Mac M1/M2/M3/M4)
#
# Na Aula 4 você preenche isso num .env e roda `source .env` antes do Kamal.
# No pipeline da nuvem, vem das Variables do GitHub Actions (ver apendice-azure.md).
# Primeiro deploy: `kamal setup`, uma vez só. Depois é sempre `kamal deploy`.

service: automic-auth-api

# Sem host aqui: o Kamal concatena registry.server + image e vira
# ghcr.io/<seu-usuario>/automic-auth-api.
image: <%= ENV.fetch("GHCR_USER") %>/automic-auth-api

# Sem login root: o Docker já está liberado para o usuário comum.
ssh:
  user: <%= ENV.fetch("KAMAL_SSH_USER", "ubuntu") %>
  # 22 quase sempre. Só muda quem alcança a VM por um encaminhamento de porta
  # (ver o plano B do Windows em docs/00-preparacao.md).
  port: <%= ENV.fetch("SSH_PORT", "22") %>
  forward_agent: false

# Onde o Kamal grava locks, auditoria e arquivos de ambiente no servidor.
run_directory: /home/<%= ENV.fetch("KAMAL_SSH_USER", "ubuntu") %>/.kamal

servers:
  web:
    hosts:
      - <%= ENV.fetch("SERVER_IP") %>

# O kamal-proxy termina o TLS e repassa para o Rails em HTTP interno.
#
# Na Aula 4 os PEM são de um certificado autoassinado que você gerou com openssl
# (o navegador reclama, e essa reclamação é a aula sobre CA). Numa VPS atrás do
# Cloudflare, são o certificado Origin CA. Em nenhum dos casos eles entram no
# container do Rails.
proxy:
  ssl:
    certificate_pem: KAMAL_PROXY_SSL_CERTIFICATE
    private_key_pem: KAMAL_PROXY_SSL_PRIVATE_KEY
  host: <%= ENV.fetch("APP_HOST") %>
  # Preserva o X-Forwarded-For/Proto que vem de um proxy anterior confiável.
  forward_headers: true

registry:
  server: ghcr.io
  username: <%= ENV.fetch("GHCR_USER") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

# A imagem é buildada no seu notebook e roda no servidor: as duas arquiteturas
# precisam bater. Como a VM da Aula 4 roda no seu próprio hardware, é a sua.
builder:
  arch: <%= ENV.fetch("SERVER_ARCH", "amd64") %>

env:
  clear:
    # O Solid Queue roda dentro do Puma — sem processo separado. Uma VM
    # pequena não comporta um worker dedicado.
    SOLID_QUEUE_IN_PUMA: "true"
    # 1 vCPU dividido com o Postgres: um worker só.
    WEB_CONCURRENCY: "1"
    # Host do banco: é o nome do accessory na rede do Kamal.
    DB_HOST: automic-auth-api-db
    DB_USER: automic_auth_api
    APP_NAME: "Automic Auth API"
    SMTP_PORT: "587"
    SMTP_AUTHENTICATION: "plain"
    SMTP_ENABLE_STARTTLS_AUTO: "true"
  secret:
    - RAILS_MASTER_KEY
    - AUTOMIC_AUTH_API_DATABASE_PASSWORD
    - JWT_SECRET
    - CORS_ORIGINS
    - MAILER_FROM
    - SMTP_ADDRESS
    - SMTP_USERNAME
    - SMTP_PASSWORD

# PostgreSQL como accessory: um container no mesmo host, com volume próprio.
# Não é banco gerenciado — é decisão consciente (ver docs/04-deploy.md).
accessories:
  db:
    image: postgres:16
    host: <%= ENV.fetch("SERVER_IP") %>
    env:
      clear:
        POSTGRES_USER: automic_auth_api
        POSTGRES_DB: automic_auth_api_production
      secret:
        # Mesmo valor de AUTOMIC_AUTH_API_DATABASE_PASSWORD.
        - POSTGRES_PASSWORD
    # O volume é o que faz os dados sobreviverem a deploy e a rebuild do container.
    directories:
      - data:/var/lib/postgresql/data
