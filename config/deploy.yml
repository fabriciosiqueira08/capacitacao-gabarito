# Kamal: deploy da automic-auth-api. Docs: https://kamal-deploy.org
#
# Este arquivo é IGUAL para todo mundo da turma, e é o MESMO que serviria num
# servidor alugado. O que muda vem de variáveis de ambiente:
#
#   GHCR_USER       seu usuário do GitHub (dono da imagem no ghcr.io)
#   APP_HOST        o hostname servido, ex.: seunome.test
#   SERVER_ARCH     amd64 (Intel/AMD) ou arm64 (Mac M1/M2/M3/M4)
#   SERVER_IP       onde o app roda. Na Aula 4 é 127.0.0.1: a sua própria
#                   máquina. Numa VPS, o IP público dela.
#   KAMAL_SSH_USER  usuário do SSH. Na Aula 4 é o seu próprio login.
#
# Você preenche isso num .env e roda `source .env` antes de qualquer comando do
# Kamal. No pipeline da nuvem, vem das Variables do GitHub Actions (ver
# docs/apendice-azure.md). Primeiro deploy: `kamal setup`, uma vez só.

service: automic-auth-api

# Sem host aqui: o Kamal concatena registry.server + image e vira
# ghcr.io/<seu-usuario>/automic-auth-api.
image: <%= ENV.fetch("GHCR_USER") %>/automic-auth-api

# O Kamal conversa com o servidor por SSH. Na Aula 4 o servidor é a sua
# máquina, então ele abre uma conexão SSH consigo mesma: mesmo caminho, mesmo
# arquivo de configuração, e nada de especial no código.
ssh:
  user: <%= ENV.fetch("KAMAL_SSH_USER", ENV.fetch("USER", "root")) %>
  port: <%= ENV.fetch("SSH_PORT", "22") %>
  forward_agent: false

servers:
  web:
    hosts:
      - <%= ENV.fetch("SERVER_IP", "127.0.0.1") %>

# O kamal-proxy termina o TLS e repassa para o Rails em HTTP interno.
#
# Na Aula 4 os PEM são de um certificado autoassinado que você gerou com
# openssl, e o navegador reclama dele: essa reclamação é a aula sobre CA.
# Num servidor com domínio, são um certificado emitido por uma CA pública.
# Em nenhum dos casos eles entram no container do Rails.
proxy:
  ssl:
    certificate_pem: KAMAL_PROXY_SSL_CERTIFICATE
    private_key_pem: KAMAL_PROXY_SSL_PRIVATE_KEY
  host: <%= ENV.fetch("APP_HOST") %>
  # Preserva o X-Forwarded-For/Proto que vem de um proxy anterior confiável.
  forward_headers: true

registry:
  server: ghcr.io
  username: <%= ENV.fetch("GHCR_USER") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

# A imagem é buildada e roda na mesma máquina, então a arquitetura é a sua.
builder:
  arch: <%= ENV.fetch("SERVER_ARCH", "amd64") %>

env:
  clear:
    # O Solid Queue roda dentro do Puma, sem processo separado. Uma máquina
    # pequena não comporta um worker dedicado.
    SOLID_QUEUE_IN_PUMA: "true"
    # Um worker só: o Postgres divide a mesma máquina.
    WEB_CONCURRENCY: "1"
    # Host do banco: é o nome do accessory na rede do Kamal.
    DB_HOST: automic-auth-api-db
    DB_USER: automic_auth_api
    APP_NAME: "Automic Auth API"
    SMTP_PORT: "587"
    SMTP_AUTHENTICATION: "plain"
    SMTP_ENABLE_STARTTLS_AUTO: "true"
  secret:
    - RAILS_MASTER_KEY
    - AUTOMIC_AUTH_API_DATABASE_PASSWORD
    - JWT_SECRET
    - CORS_ORIGINS
    - MAILER_FROM
    - SMTP_ADDRESS
    - SMTP_USERNAME
    - SMTP_PASSWORD

# PostgreSQL como accessory: um container gerenciado pelo Kamal, com volume
# próprio. Não publica porta nenhuma no host, então ele não briga com o
# Postgres de desenvolvimento que você subiu na Aula 1.
accessories:
  db:
    image: postgres:16
    host: <%= ENV.fetch("SERVER_IP", "127.0.0.1") %>
    env:
      clear:
        POSTGRES_USER: automic_auth_api
        POSTGRES_DB: automic_auth_api_production
      secret:
        # Mesmo valor de AUTOMIC_AUTH_API_DATABASE_PASSWORD.
        - POSTGRES_PASSWORD
    # O volume é o que faz os dados sobreviverem a deploy e a rebuild.
    directories:
      - data:/var/lib/postgresql/data
